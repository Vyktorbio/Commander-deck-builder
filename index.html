<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1a1b">
<meta name="description" content="Mesa e deck de Commander num app só: vida, dano de comandante, marcadores, construtor de deck, probabilidades, mão de teste e combos.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Commander</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,600;0,700;0,800;1,500&family=Alegreya+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --felt:#0f1a1b;--felt-2:#152325;--felt-3:#1c2e31;--felt-4:#243a3d;
  --line:#2a4143;--line-2:#365255;
  --bone:#ede5d1;--bone-2:#c9c0aa;--muted:#93a39f;--faint:#6d807c;
  --brass:#d9aa4f;--brass-2:#f0c873;--brass-ink:#231904;
  --danger:#ef8572;--danger-bg:#2d1a17;--ok:#86cd9f;--warn:#e9c46a;
  --mW:#efe5c0;--mU:#7db8e4;--mB:#b6a6c6;--mR:#e7806a;--mG:#7cc392;--mC:#c8c2b4;
  --serif:"Alegreya",Georgia,"Times New Roman",serif;
  --sans:"Alegreya Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-panel:20px;--r-ctl:12px;--card-r:4.6%/3.4%;
  --accent:var(--brass);--green:var(--ok);--red:var(--danger);--text:var(--bone);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--felt)}
body{margin:0;min-height:100%;font-family:var(--sans);font-size:15px;line-height:1.5;background:var(--felt);color:var(--bone);overscroll-behavior-y:none;font-variant-numeric:lining-nums}
button,input,select,textarea{font:inherit}
button{color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none;user-select:none;-webkit-user-select:none}
button:disabled{opacity:.38;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--brass-2);outline-offset:3px}
button:not(:disabled):active{transform:scale(.97)}
input,select,textarea{color:var(--bone);background:var(--felt);border:1px solid var(--line-2);border-radius:var(--r-ctl);min-height:46px;padding:10px 13px;width:100%}
textarea{min-height:150px;resize:vertical;line-height:1.45}
input::placeholder,textarea::placeholder{color:var(--faint)}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--brass);flex-shrink:0;padding:0}
input[type=number]{font-variant-numeric:tabular-nums}
svg{width:20px;height:20px;display:block;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
button svg{pointer-events:none}
a{color:var(--brass-2);text-underline-offset:3px}
.mono{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- Casca ---------- */
.app{max-width:1600px;margin:auto;padding:max(14px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));min-height:100dvh;display:flex;flex-direction:column;gap:14px}
.topbar{display:flex;align-items:center;gap:14px}
.brand{display:flex;gap:10px;align-items:center;min-width:0;margin-right:10px}
.brand-mark{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:var(--brass);background:var(--felt-2);border:1px solid var(--line)}
.brand-mark svg{width:24px;height:24px}
.brand-name{font-family:var(--serif);font-size:22px;font-weight:700;line-height:1;letter-spacing:.2px}
.brand-sub{font-size:12px;color:var(--muted);margin-top:3px}
.views{margin-right:auto;display:flex;padding:4px;gap:2px;border-radius:14px;background:var(--felt-2);border:1px solid var(--line)}
.views button{min-height:38px;padding:6px 18px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted)}
.views button[aria-selected=true]{background:var(--brass);color:var(--brass-ink)}
.top-actions{display:flex;align-items:center;gap:8px}
body:not([data-view=table]) .table-only{display:none!important}
.view{display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 15px;border-radius:var(--r-ctl);background:var(--felt-3);border:1px solid var(--line-2);font-size:14px;font-weight:700;white-space:nowrap;color:var(--bone);text-decoration:none}
.btn:hover:not(:disabled){background:var(--felt-4)}
.btn.primary{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.btn.primary:hover:not(:disabled){background:var(--brass-2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--bone-2)}
.btn.ghost:hover:not(:disabled){background:var(--felt-3)}
.btn.danger{border-color:#6b3a33;color:#ffb3a5;background:var(--danger-bg)}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13px;border-radius:10px}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--felt-2)}
.icon-btn:hover{background:var(--felt-3)}
.wake-btn.active{color:var(--ok);border-color:#2f5a44}
.wake-btn.waiting{color:var(--warn)}
.eyebrow{font-size:13px;color:var(--muted)}

/* ---------- Mesa ---------- */
.match-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px;min-height:22px;font-size:13px;color:var(--bone-2)}
.match-meta .left{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.live-dot{height:7px;width:7px;background:var(--brass);border-radius:50%}
.sep{color:var(--faint)}
.save-state{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.save-state .dot{height:6px;width:6px;background:var(--ok);border-radius:50%}
.save-state.failed{color:var(--warn)}.save-state.failed .dot{background:var(--warn)}
.board{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));flex:1;min-height:0}
.board[data-count="1"]{grid-template-columns:1fr}
.board[data-count="3"],.board[data-count="5"],.board[data-count="6"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.player{position:relative;min-height:245px;overflow:hidden;border:1px solid var(--line);border-radius:var(--r-panel);background:var(--felt-2);isolation:isolate}
.player:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(160deg,color-mix(in srgb,var(--pc) 16%,transparent),transparent 55%)}
.player.has-art:before{background-image:linear-gradient(180deg,rgba(10,18,19,.55) 0%,rgba(10,18,19,.82) 55%,rgba(10,18,19,.93) 100%),var(--art);background-size:cover;background-position:center 30%}
.player:after{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:0 3px 3px 0;background:var(--pc)}
.player.active{border-color:color-mix(in srgb,var(--pc) 70%,var(--line));box-shadow:0 0 0 1px color-mix(in srgb,var(--pc) 45%,transparent)}
.player.out{opacity:.5;filter:saturate(.3)}
.player-content{height:100%;display:flex;flex-direction:column;padding:16px 18px 14px;gap:8px;min-width:0}
.player-content.rotated{transform:rotate(180deg)}
.player-top{display:flex;align-items:center;justify-content:space-between;gap:7px}
.player-identity{display:flex;align-items:center;gap:10px;min-width:0;text-align:left;padding:0;min-height:38px}
.avatar{width:32px;height:32px;flex-shrink:0;display:grid;place-items:center;border-radius:10px;color:var(--pc);background:color-mix(in srgb,var(--pc) 14%,var(--felt));font-size:14px;font-weight:800;border:1px solid color-mix(in srgb,var(--pc) 35%,transparent)}
.player-name{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:24ch;line-height:1.2}
.player-cmd{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--bone-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32ch;margin-top:2px;line-height:1.25}
.player-tools{display:flex;gap:2px;align-items:center}
.small-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.small-icon:hover{background:rgba(255,255,255,.05)}
.small-icon svg{width:17px;height:17px}
.turn-light{width:8px;height:8px;border-radius:50%;background:var(--pc);box-shadow:0 0 12px var(--pc);margin-right:6px}
.life-controls{display:grid;grid-template-columns:1fr 1.5fr 1fr;align-items:center;flex:1;min-height:105px;gap:6px}
.life-side{display:grid;place-items:center;height:100%;min-height:90px;border-radius:16px;color:color-mix(in srgb,var(--pc) 60%,var(--bone));font-size:40px;font-weight:300}
.life-side:hover{background:rgba(255,255,255,.04)}
.life-center{display:flex;align-items:center;flex-direction:column;justify-content:center;position:relative;padding:4px 0;min-width:0;min-height:100px}
.life-value{font-family:var(--sans);font-size:clamp(72px,7vw,118px);font-weight:800;letter-spacing:-3px;line-height:.9;font-variant-numeric:tabular-nums;text-shadow:0 2px 24px rgba(0,0,0,.45)}
.life-value.long{font-size:clamp(46px,5vw,80px);letter-spacing:-2px}
.life-label{font-size:12px;color:var(--muted);margin-top:6px}
.delta{position:absolute;top:-6px;right:4px;color:var(--pc);font-size:16px;font-weight:800;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;font-variant-numeric:tabular-nums}
.delta.visible{opacity:1}
.quick-life{display:flex;justify-content:center;gap:10px}
.quick-btn{width:48px;height:32px;border:1px solid var(--line);background:rgba(0,0,0,.18);color:var(--bone-2);border-radius:10px;font-size:13px;font-weight:700}
.player-bottom{display:flex;gap:6px;padding-top:6px;align-items:center}
.chip{display:flex;align-items:center;gap:6px;justify-content:center;min-width:0;flex:1;min-height:38px;border-radius:11px;border:1px solid var(--line);background:rgba(0,0,0,.22);font-size:13px;color:var(--bone-2);padding:6px 9px}
.chip svg{width:16px;height:16px}
.chip .count{font-weight:800;color:var(--bone);font-variant-numeric:tabular-nums}
.chip .denom{font-size:11px;color:var(--faint)}
.chip.danger{color:var(--danger);border-color:#6b3a33;background:var(--danger-bg)}
.chip.danger .count{color:var(--danger)}
.marker-chip{flex:.7;color:var(--pc)}
.status-line{font-size:12px;color:var(--danger);display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.status-line:empty{display:none}
.status-badge{padding:2px 7px;border-radius:7px;background:rgba(255,255,255,.06);color:var(--bone-2);display:inline-flex;gap:4px;align-items:center}
.status-badge svg{width:12px;height:12px}
.status-badge.warn{color:#ffb3a5;background:var(--danger-bg)}
.bottom-bar{display:flex;align-items:center;gap:10px;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px}
.bottom-group{display:flex;align-items:center;gap:6px}
.time-center{text-align:center;line-height:1.35;color:var(--bone-2);font-size:13px;flex-direction:column;gap:0!important}
.time-center strong{font-weight:800;color:var(--bone);font-size:16px}
.turn-btn{min-width:170px}
.footer-note{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--faint);font-size:12px;padding:0 2px}
.footer-note button{font-size:12px;padding:2px 0;color:var(--bone-2);text-decoration:underline;text-underline-offset:3px}

/* ---------- Diálogos ---------- */
dialog{border:1px solid var(--line-2);background:var(--felt-2);color:var(--bone);border-radius:24px;padding:0;width:min(600px,calc(100vw - 20px));max-height:calc(100dvh - 24px);overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.7)}
dialog.wide{width:min(880px,calc(100vw - 20px))}
dialog::backdrop{background:rgba(4,9,10,.72);backdrop-filter:blur(6px)}
dialog[open]{animation:sheet .22s ease-out}
@keyframes sheet{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.modal-shell{display:flex;flex-direction:column;max-height:calc(100dvh - 26px)}
.modal-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 22px 14px;flex-shrink:0;border-bottom:1px solid var(--line)}
.modal-heading{font-family:var(--serif);font-size:25px;line-height:1.15;font-weight:700;margin:2px 0 0}
.modal-body{padding:18px 22px 24px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.modal-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 22px;border-top:1px solid var(--line);flex-shrink:0;background:var(--felt)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;margin-bottom:18px}
.tab{flex:1;min-height:42px;border-radius:11px;padding:8px 12px;background:var(--felt-3);color:var(--bone-2);font-size:14px;font-weight:700;white-space:nowrap}
.tab.active{background:var(--brass);color:var(--brass-ink)}
.text-muted{color:var(--bone-2);font-size:14px;line-height:1.6}
.hint{font-size:13px;color:var(--muted);line-height:1.55;margin:8px 0 14px}
.section-label{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--bone);margin:22px 0 8px}
.section-label:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);min-height:60px}
.row:last-child{border-bottom:0}
.row-label{display:flex;align-items:center;gap:10px;font-size:14px;min-width:0}
.row-label>div{min-width:0}
.row-label strong{font-size:15px;line-height:1.35;display:block;overflow-wrap:anywhere}
.row-label small{display:block;font-size:12px;color:var(--muted);line-height:1.45}
.row-icon{display:grid;place-items:center;color:var(--brass);min-width:30px}
.stepper{display:flex;align-items:center;gap:4px;flex-shrink:0}
.stepper button{width:40px;height:42px;background:var(--felt-3);border:1px solid var(--line-2);border-radius:11px;font-size:20px;color:var(--bone)}
.stepper .step-value{min-width:38px;text-align:center;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stepper .step-value.alert{color:var(--danger)}
.mode-select{min-height:44px;margin:8px 0 4px}
.tag{font-size:12px;background:rgba(217,170,79,.12);border:1px solid rgba(217,170,79,.35);color:var(--brass-2);padding:2px 8px;display:inline-block;border-radius:8px;margin-top:4px}
.field{margin-bottom:16px}
.field label,.field>.label{display:block;font-size:14px;color:var(--bone-2);margin-bottom:6px;font-weight:600}
.two-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.choice{border:1px solid var(--line-2);background:var(--felt-3);border-radius:12px;height:48px;font-size:20px;font-weight:800}
.choice.selected{border-color:var(--brass);background:var(--brass);color:var(--brass-ink)}
.toggle-label{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px}
.toggle-label small{display:block;color:var(--muted);font-size:13px;line-height:1.45;margin-top:2px}
.state-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.state-button{text-align:left;display:flex;align-items:center;gap:10px;padding:12px;min-height:54px;font-size:14px;font-weight:700;background:var(--felt-3);border:1px solid var(--line-2);border-radius:13px}
.state-button.on{color:var(--brass-ink);border-color:var(--brass);background:var(--brass)}
.mana-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mana-row{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--felt);border:1px solid var(--line);border-radius:13px;padding:8px}
.mana-symbol{font-size:15px;font-weight:800;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;flex-shrink:0;color:#1a1a1a}
.mana-W{background:var(--mW)}.mana-U{background:var(--mU)}.mana-B{background:var(--mB)}.mana-R{background:var(--mR)}.mana-G{background:var(--mG)}.mana-C{background:var(--mC)}
.mana-row .stepper{gap:2px}.mana-row .stepper button{width:32px;height:36px;border-radius:9px}.mana-row .step-value{min-width:26px;font-size:19px}
.color-palette{display:flex;gap:9px;flex-wrap:wrap}
.color-dot{width:38px;height:38px;border:3px solid transparent;border-radius:50%;background:var(--swatch)}
.color-dot.selected{border-color:var(--bone);box-shadow:0 0 0 2px var(--swatch)}
.commander-editor{margin-top:10px;padding:12px;background:var(--felt);border:1px solid var(--line);border-radius:13px}
.commander-editor label{font-size:13px;color:var(--bone-2);display:block;margin-bottom:6px}
.deck-pick{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:13px;background:var(--felt)}
.deck-pick img,.deck-pick .ph{width:72px;height:52px;object-fit:cover;border-radius:8px;background:var(--felt-3)}
.history-list{margin:0;padding:0;list-style:none}
.history-list li{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;font-size:14px;line-height:1.5}
.history-list time{font-size:12px;color:var(--faint);flex-shrink:0;padding-top:2px;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:30px 10px;color:var(--muted);font-size:15px;line-height:1.6}
.dice-face{display:grid;place-items:center;min-height:150px;font-size:96px;font-weight:800;letter-spacing:-4px;color:var(--brass);font-variant-numeric:tabular-nums}
.dice-controls{display:flex;gap:8px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
.starter-result{text-align:center;background:var(--felt);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:18px}
.starter-result strong{display:block;font-family:var(--serif);font-size:26px;margin-bottom:12px;color:var(--brass-2)}
.info-box{padding:13px 14px;border:1px solid var(--line-2);background:var(--felt);border-radius:13px;font-size:14px;line-height:1.6;color:var(--bone-2);margin-top:12px}
.rules-list{padding-left:19px;color:var(--bone-2);font-size:14px;line-height:1.7}
.rules-list li{padding:4px 0}
#toast{position:fixed;z-index:60;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(15px);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100vw - 28px);width:max-content;background:var(--bone);color:#16211f;font-size:14px;font-weight:700;padding:12px 18px;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.5);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sr-only{position:absolute;clip:rect(0,0,0,0);clip-path:inset(50%);height:1px;width:1px;overflow:hidden;white-space:nowrap}
.import-input{display:none}

/* ---------- Deck ---------- */
.dk{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
.dk-rail{position:sticky;top:12px;display:flex;flex-direction:column;gap:6px;max-height:calc(100dvh - 100px);overflow:auto;padding-right:2px}
.dk-rail h2{font-family:var(--serif);font-size:19px;margin:0 0 6px}
.dk-rail-actions{display:flex;gap:6px;margin-bottom:8px}
.dk-rail-actions .btn{flex:1}
.deck-item{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;text-align:left;padding:7px;border-radius:14px;border:1px solid transparent}
.deck-item:hover{background:var(--felt-2)}
.deck-item[aria-current=true]{background:var(--felt-2);border-color:var(--line-2)}
.deck-item .thumb{width:52px;height:38px;border-radius:8px;background:var(--felt-3) center/cover;display:grid;place-items:center;color:var(--faint)}
.deck-item strong{display:block;font-size:15px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deck-item small{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px}
.dk-main{min-width:0;display:flex;flex-direction:column;gap:14px}

.dk-hero{position:relative;border-radius:24px;overflow:hidden;min-height:260px;display:flex;flex-direction:column;justify-content:space-between;padding:16px 20px 18px;background:var(--felt-2);border:1px solid var(--line);isolation:isolate}
.dk-hero.has-art{background:linear-gradient(90deg,rgba(9,16,17,.92) 0%,rgba(9,16,17,.7) 45%,rgba(9,16,17,.15) 100%),linear-gradient(0deg,rgba(9,16,17,.9) 0%,transparent 50%),var(--art) center 28%/cover;border-color:transparent}
.dk-hero-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dk-switch{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:700;padding:8px 12px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);max-width:100%}
.dk-switch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk-switch svg{width:16px;height:16px}
.dk-hero-top .spacer{flex:1}
.dk-hero .btn{background:rgba(0,0,0,.35);border-color:rgba(255,255,255,.14);backdrop-filter:blur(6px)}
.dk-hero .btn.primary{background:var(--brass);border-color:var(--brass)}
.dk-cmd{font-family:var(--serif);font-weight:800;font-size:clamp(34px,4.6vw,58px);line-height:.98;margin:22px 0 10px;max-width:16ch;text-wrap:balance;text-shadow:0 2px 30px rgba(0,0,0,.6)}
.dk-cmd small{display:block;font-size:.45em;font-weight:500;font-style:italic;color:var(--bone-2);margin-top:8px;letter-spacing:0}
.dk-cmd.placeholder{color:var(--bone-2);font-weight:700}
.dk-ci{display:flex;gap:6px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.dk-facts{display:flex;flex-wrap:wrap;gap:6px 26px;margin:0}
.dk-facts div{min-width:0}
.dk-facts dt{font-size:12px;color:var(--bone-2)}
.dk-facts dd{margin:0;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.dk-facts dd.bad{color:var(--danger)}.dk-facts dd.good{color:var(--bone)}
.dk-facts dd small{font-size:14px;font-weight:600;color:var(--bone-2)}

.dk-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:5;background:var(--felt);margin:0 -2px;padding:0 2px}
.dk-tabs::-webkit-scrollbar{display:none}
.dk-tabs button{position:relative;padding:12px 14px;font-size:15px;font-weight:700;color:var(--muted);white-space:nowrap}
.dk-tabs button[aria-selected=true]{color:var(--bone)}
.dk-tabs button[aria-selected=true]:after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--brass)}
.dk-tabs .n{font-size:12px;color:var(--faint);margin-left:4px;font-variant-numeric:tabular-nums}

.panel{background:var(--felt-2);border:1px solid var(--line);border-radius:var(--r-panel);padding:18px 18px 20px;min-width:0}
.panel h3{font-family:var(--serif);font-size:21px;line-height:1.2;margin:0 0 4px}
.panel .sub{color:var(--muted);font-size:14px;margin:0 0 14px;max-width:70ch}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.span2{grid-column:span 2}
.stack{display:flex;flex-direction:column;gap:14px}

/* Busca e adicionar */
.addbar{display:grid;grid-template-columns:minmax(0,1fr) 84px auto;gap:8px;align-items:start}
.ac{position:relative}
.ac-box{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 6px);background:var(--felt-3);border:1px solid var(--line-2);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.55);max-height:300px;overflow-y:auto;padding:4px}
.ac-item{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;font-family:var(--serif);font-size:16px}
.ac-item:hover,.ac-item.active{background:var(--felt-4)}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.toolbar .grow{flex:1}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:thin}
.fchip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:4px 12px;border-radius:999px;border:1px solid var(--line-2);font-size:14px;font-weight:600;color:var(--bone-2);white-space:nowrap}
.fchip .n{font-variant-numeric:tabular-nums;color:var(--faint);font-weight:700}
.fchip[aria-pressed=true]{background:var(--bone);color:#16211f;border-color:var(--bone)}
.fchip[aria-pressed=true] .n{color:#4c5a57}

/* Lista de cartas */
.cgroup{margin-top:14px}
.cgroup h4{display:flex;align-items:baseline;gap:8px;font-family:var(--serif);font-size:18px;margin:0 0 4px;padding:0 4px}
.cgroup h4 .n{font-family:var(--sans);font-size:13px;color:var(--muted);font-weight:700}
.crow{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 8px;border-radius:12px;min-height:46px}
.crow:hover{background:var(--felt-3)}
.crow .q{font-weight:800;color:var(--bone-2);text-align:right;font-variant-numeric:tabular-nums}
.crow .nm{min-width:0;display:flex;flex-direction:column}
.crow .nm b{font-family:var(--serif);font-weight:600;font-size:16px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .nm span{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.crow .px{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.crow.flag b{color:#ffb3a5}
.rtag{font-size:11px;font-weight:700;padding:0 6px;border-radius:6px;background:rgba(255,255,255,.06);color:var(--bone-2);line-height:18px}
.rtag.gc{background:rgba(217,170,79,.16);color:var(--brass-2)}
.rtag.err{background:var(--danger-bg);color:#ffb3a5}

/* Símbolos de mana */
.cost{display:inline-flex;gap:2px;align-items:center;flex-shrink:0}
.pip{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-size:11px;font-weight:800;color:#161616;background:var(--mC);line-height:1;box-shadow:inset 0 -1px 0 rgba(0,0,0,.25)}
.pip.W{background:var(--mW)}.pip.U{background:var(--mU)}.pip.B{background:var(--mB)}.pip.R{background:var(--mR)}.pip.G{background:var(--mG)}
.pip.h{background:linear-gradient(135deg,var(--a) 50%,var(--b) 50%)}
.pip.lg{width:26px;height:26px;font-size:14px}
.cost .sl{color:var(--faint);padding:0 3px}

/* Gráficos */
.bars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;align-items:end;gap:8px;height:170px;padding-top:22px}
.bar{position:relative;background:var(--brass);border-radius:7px 7px 3px 3px;min-height:2px}
.bar span{position:absolute;top:-21px;left:0;right:0;text-align:center;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.bar-x{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-top:6px;text-align:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.hbars{display:flex;flex-direction:column;gap:9px}
.hbar{display:grid;grid-template-columns:118px minmax(0,1fr) 46px;gap:10px;align-items:center;font-size:14px}
.hbar .track{height:12px;background:var(--felt);border-radius:6px;overflow:hidden;position:relative}
.hbar .fill{height:100%;background:var(--bone-2);border-radius:6px}
.hbar .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.target{position:absolute;top:0;bottom:0;background:rgba(134,205,159,.22);border-left:1px solid rgba(134,205,159,.6);border-right:1px solid rgba(134,205,159,.6)}
.colorpair{display:grid;grid-template-columns:30px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:14px}
.colorpair .tracks{display:flex;flex-direction:column;gap:4px}
.colorpair .t{height:9px;border-radius:5px;background:var(--felt)}
.colorpair .t i{display:block;height:100%;border-radius:5px}
.colorpair .v{font-size:13px;color:var(--bone-2);text-align:right;line-height:1.3;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.issues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.issues li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;padding:9px 11px;border-radius:11px;background:var(--felt)}
.issues li.error{background:var(--danger-bg);color:#ffd2c9}
.issues li svg{width:17px;height:17px;margin-top:1px;flex-shrink:0}
.allgood{display:flex;gap:10px;align-items:center;color:var(--ok);font-weight:700}

.bracket-dial{display:flex;gap:5px;margin:10px 0 12px}
.bracket-dial span{flex:1;height:44px;border-radius:10px;background:var(--felt);display:grid;place-items:center;font-size:20px;font-weight:800;color:var(--faint);border:1px solid var(--line)}
.bracket-dial span.on{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.bracket-dial span.lo{border-color:var(--brass);color:var(--brass-2)}
.reasons{margin:0;padding-left:18px;color:var(--bone-2);font-size:14px;line-height:1.55}
.reasons li{padding:2px 0}

/* Probabilidades */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 12px;margin-bottom:12px}
.form-grid label{display:block;font-size:13px;color:var(--bone-2);font-weight:600;margin-bottom:5px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;min-height:46px}
.headline{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.headline .big{font-size:52px;font-weight:800;letter-spacing:-1.5px;line-height:1;font-variant-numeric:tabular-nums;color:var(--brass-2)}
.headline p{margin:0;max-width:44ch;color:var(--bone-2);font-size:15px}
.ttable{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.ttable th,.ttable td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line)}
.ttable th:first-child,.ttable td:first-child{text-align:left}
.ttable th{font-weight:700;color:var(--muted);font-size:13px}
.ttable td.heat{position:relative}
.ttable td.heat i{position:absolute;inset:3px 2px;border-radius:5px;background:var(--brass);opacity:var(--o);z-index:0}
.ttable td.heat b{position:relative;z-index:1;font-weight:700}
.scroll-x{overflow-x:auto}
.progress{height:6px;border-radius:3px;background:var(--felt);overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;background:var(--brass);width:0;transition:width .15s}
.delta-up{color:var(--ok);font-weight:700}.delta-down{color:var(--danger);font-weight:700}
.sens{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.sens .btn{flex-direction:column;align-items:flex-start;gap:2px;min-height:62px;white-space:normal;text-align:left}
.sens .btn small{font-weight:600;color:var(--bone-2)}

/* Mão de teste */
.hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.hcard{position:relative;aspect-ratio:63/88;border-radius:var(--card-r);overflow:hidden;background:var(--felt-3);border:1px solid var(--line);text-align:left}
.hcard img{width:100%;height:100%;object-fit:cover;display:block}
.hcard .fb{position:absolute;inset:0;padding:10px;display:flex;flex-direction:column;gap:6px;font-family:var(--serif);font-size:14px;line-height:1.2}
.hcard .fb small{font-family:var(--sans);font-size:12px;color:var(--muted)}
.hcard.sel{outline:3px solid var(--danger);outline-offset:-3px}
.hcard.sel:after{content:"Fundo";position:absolute;left:8px;top:8px;background:var(--danger);color:#2a0f0a;font-size:12px;font-weight:800;padding:2px 8px;border-radius:8px}
.hcard.new{box-shadow:0 0 0 2px var(--brass)}

/* Combos */
.combo{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--felt);display:flex;flex-direction:column;gap:8px}
.combo .pieces{display:flex;flex-wrap:wrap;gap:6px}
.piece{font-family:var(--serif);font-size:15px;padding:3px 10px;border-radius:9px;background:var(--felt-3);border:1px solid var(--line-2)}
.piece.cmd{border-color:var(--brass);color:var(--brass-2)}
.piece.miss{border-style:dashed;border-color:var(--danger);color:#ffb3a5}
.combo .res{font-size:14px;color:var(--bone-2)}
.combo details summary{cursor:pointer;font-size:13px;color:var(--muted)}
.combo details p{white-space:pre-line;font-size:14px;color:var(--bone-2);margin:8px 0 0;line-height:1.55}
.combo .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}

/* Ficha da carta */
.card-sheet{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:20px}
.card-img{width:100%;aspect-ratio:63/88;border-radius:var(--card-r);background:var(--felt-3);overflow:hidden;position:relative}
.card-img img{width:100%;height:100%;object-fit:cover;display:block}
.card-img .fb{position:absolute;inset:0;display:grid;place-items:center;padding:16px;text-align:center;font-family:var(--serif);color:var(--muted)}
.oracle{font-family:var(--serif);font-size:16px;line-height:1.5;white-space:pre-line;color:var(--bone);margin:8px 0 12px}
.oracle .pip{vertical-align:-3px}
.typeline{font-size:14px;color:var(--bone-2);font-style:italic;font-family:var(--serif)}
.role-toggles{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.role-toggles button{min-height:34px;padding:4px 12px;border-radius:999px;border:1px solid var(--line-2);font-size:14px;font-weight:600;color:var(--bone-2)}
.role-toggles button[aria-pressed=true]{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.role-toggles button.manual{box-shadow:inset 0 0 0 1px var(--bone)}
.kv{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--bone-2);margin:6px 0}
.kv b{color:var(--bone);font-variant-numeric:tabular-nums}

.empty-state{text-align:center;padding:44px 18px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty-state h3{font-family:var(--serif);font-size:26px;margin:0}
.empty-state p{max-width:46ch;color:var(--bone-2);margin:0}
.empty-state .toolbar{justify-content:center;margin-top:6px}
.notice{font-size:14px;color:var(--bone-2);background:var(--felt);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.loading{display:flex;align-items:center;gap:10px;color:var(--bone-2);font-size:14px}
.spinner{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--brass);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.menu{display:flex;flex-direction:column;gap:2px}
.menu button,.menu a{display:flex;gap:12px;align-items:center;text-align:left;padding:12px;border-radius:12px;font-size:15px;font-weight:600;color:var(--bone);text-decoration:none}
.menu button:hover,.menu a:hover{background:var(--felt-3)}
.menu .danger{color:#ffb3a5}
.menu small{display:block;color:var(--muted);font-weight:400;font-size:13px}

/* ---------- Responsivo ---------- */
@media(min-width:1000px){.board[data-count="2"] .life-value,.board[data-count="1"] .life-value{font-size:156px}.board[data-count="2"] .player,.board[data-count="1"] .player{min-height:430px}.board[data-count="4"] .player{min-height:280px}.board[data-count="3"] .player{min-height:460px}}
@media(max-width:1100px){.dk{grid-template-columns:1fr}.dk-rail{display:none}}
@media(max-width:850px){
  .app{gap:12px;padding-left:12px;padding-right:12px}
  .top-actions .btn{padding:9px 10px}.wake-text{display:none}
  .board{gap:9px}.player-content{padding:13px 13px 11px}.life-value{font-size:84px}
  .board[data-count="3"]{grid-template-columns:repeat(2,minmax(0,1fr))}.board[data-count="3"] .player:last-child{grid-column:1 / -1}
  .chip{padding:6px}.player-name{max-width:15ch}
  .grid2,.grid3{grid-template-columns:1fr}.span2{grid-column:auto}
  .card-sheet{grid-template-columns:1fr}.card-img{max-width:280px;margin:0 auto}
}
@media(max-width:600px){
  body{font-size:15px}
  .app{gap:10px;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
  .topbar{gap:8px}
  .brand-sub,.brand-name{display:none}
  .brand-mark{width:38px;height:38px}
  .views button{padding:6px 13px;min-height:36px}
  .top-actions{gap:5px}.top-actions .btn{min-height:38px;padding:7px 9px;font-size:13px;gap:5px}.top-actions .btn svg{width:17px;height:17px}
  .players-text{display:none}
  .icon-btn{width:38px;height:38px;border-radius:11px}.icon-btn svg{width:18px;height:18px}
  .fullscreen-btn{display:none}
  .match-meta{font-size:12px}.save-state{font-size:11px}
  .board{gap:7px;grid-template-columns:repeat(2,minmax(0,1fr))!important}.board[data-count="1"]{grid-template-columns:1fr!important}
  .player{min-height:214px;border-radius:17px}.player:after{top:14px;bottom:14px}
  .player-content{padding:9px 8px 8px 10px;gap:4px}
  .player-identity{gap:6px;min-height:31px}.avatar{width:26px;height:26px;font-size:12px;border-radius:8px}
  .player-name{font-size:13px;max-width:11ch}.player-cmd{font-size:11px;max-width:15ch;margin-top:1px}
  .small-icon{width:28px;height:30px}.small-icon svg{width:15px;height:15px}.player-tools{gap:0}.turn-light{width:6px;height:6px;margin-right:2px}
  .life-controls{grid-template-columns:40px minmax(0,1fr) 40px;gap:0;min-height:94px}
  .life-side{font-size:30px;min-height:82px;border-radius:10px}.life-center{min-height:84px}
  .life-value{font-size:72px;letter-spacing:-2px}.life-value.long{font-size:40px!important;letter-spacing:-1px}.life-label{font-size:11px}
  .quick-btn{height:30px;width:42px;font-size:12px}
  .player-bottom{gap:4px;padding-top:4px}
  .chip{min-height:33px;padding:5px 4px;font-size:12px;gap:3px;border-radius:9px}.chip svg{width:13px;height:13px}.denom,.chip-name{display:none}.marker-chip{flex:.55}
  .status-line{font-size:11px}.status-badge{padding:1px 5px}
  .bottom-bar{gap:6px;padding-top:10px;flex-wrap:wrap}.bottom-group{gap:4px}
  .bottom-bar .btn{min-height:42px;padding:8px 10px;font-size:13px}.turn-btn{min-width:124px}.time-center{font-size:12px}.toolbar-label{display:none}
  .footer-note{font-size:11px}
  .modal-header{padding:18px 16px 12px}.modal-heading{font-size:23px}.modal-body{padding:16px}.modal-footer{padding:12px 16px}
  .choice-grid{gap:6px}.choice{height:44px}.stepper .step-value{min-width:32px;font-size:20px}.stepper button{width:37px}
  .board[data-count="5"] .player,.board[data-count="6"] .player{min-height:186px}
  .board[data-count="5"] .player-content,.board[data-count="6"] .player-content{gap:2px;padding:7px 7px 7px 9px}
  .board[data-count="5"] .life-controls,.board[data-count="6"] .life-controls{min-height:72px}
  .board[data-count="5"] .life-center,.board[data-count="6"] .life-center{min-height:72px}
  .board[data-count="5"] .life-side,.board[data-count="6"] .life-side{min-height:64px}
  .board[data-count="5"] .life-value,.board[data-count="6"] .life-value{font-size:60px}
  .board[data-count="5"] .life-label,.board[data-count="6"] .life-label{display:none}
  .board[data-count="5"] .quick-btn,.board[data-count="6"] .quick-btn{height:26px}
  .delta{top:-1px;right:0;font-size:13px}
  .dk-hero{min-height:236px;padding:12px 14px 14px;border-radius:20px}
  .dk-hero.has-art{background:linear-gradient(0deg,rgba(9,16,17,.95) 0%,rgba(9,16,17,.55) 60%,rgba(9,16,17,.25) 100%),var(--art) center 25%/cover}
  .dk-cmd{margin-top:46px}
  .dk-facts{gap:4px 18px}.dk-facts dd{font-size:20px}
  .hero-label{display:none}
  .panel{padding:14px 13px 16px;border-radius:17px}
  .addbar{grid-template-columns:minmax(0,1fr) 64px}
  .addbar .btn{grid-column:1 / -1}
  .crow{grid-template-columns:24px minmax(0,1fr) auto;gap:8px;padding:8px 4px}.crow .px{display:none}
  .hbar{grid-template-columns:96px minmax(0,1fr) 40px;font-size:13px}
  .hand{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .headline .big{font-size:44px}
  .sens{grid-template-columns:1fr}
  .bars{gap:5px}.bar-x{gap:5px}

<script id="deck-core">
(function(global){
'use strict';
/* ============================================================
   DeckCore — análise de deck de Commander, sem DOM.
   Cartas no formato "slim" (só os campos usados do Scryfall).
   ============================================================ */
var COLORS5=['W','U','B','R','G'];
var ROLES=[
  {key:'ramp',label:'Ramp',hint:'Pedras, criaturas de mana, busca de terreno'},
  {key:'draw',label:'Compra',hint:'Compra, impulso e vantagem de cartas'},
  {key:'removal',label:'Remoção',hint:'Remoção pontual, devolver, sacrifício'},
  {key:'wipe',label:'Remoção em massa',hint:'Destrói, exila ou devolve tudo'},
  {key:'counter',label:'Anulação',hint:'Anula mágicas'},
  {key:'tutor',label:'Tutor',hint:'Busca uma carta que não seja terreno'},
  {key:'protection',label:'Proteção',hint:'Dá resistência a permanentes'},
  {key:'recursion',label:'Recursão',hint:'Devolve cartas do cemitério'},
  {key:'wincon',label:'Vitória',hint:'Fecha o jogo'},
  {key:'stax',label:'Stax',hint:'Restringe os oponentes'}
];
/* Faixas de referência usuais da comunidade para 99 cartas. */
var TARGETS={lands:[35,38],ramp:[10,12],draw:[10,12],removal:[8,10],wipe:[2,4]};
var TYPE_ORDER=['Criatura','Planeswalker','Instantânea','Feitiço','Artefato','Encantamento','Batalha','Terreno','Outro'];

function lc(s){return String(s||'').toLowerCase();}
function clampInt(v,min,max,fb){var n=Number(v);return Number.isFinite(n)?Math.max(min,Math.min(max,Math.round(n))):fb;}

/* ---------- Scryfall → slim ---------- */
function slim(card){
  if(!card||typeof card!=='object')return null;
  var faces=Array.isArray(card.card_faces)?card.card_faces:[];
  var f0=faces[0]||{},f1=faces[1]||null;
  var img=card.image_uris||f0.image_uris||{};
  var back=f1&&f1.image_uris?f1.image_uris:null;
  var oracle=typeof card.oracle_text==='string'?card.oracle_text:faces.map(function(f){return f.oracle_text||'';}).join('\n—\n');
  var typeLine=card.type_line||faces.map(function(f){return f.type_line||'';}).join(' // ');
  var frontType=f0.type_line||typeLine.split(' // ')[0];
  var price=card.prices&&(card.prices.usd||card.prices.usd_foil||card.prices.usd_etched);
  return {
    id:String(card.id||''),oid:String(card.oracle_id||f0.oracle_id||''),
    name:String(card.name||''),mana_cost:card.mana_cost!=null&&card.mana_cost!==''?card.mana_cost:(f0.mana_cost||''),
    cmc:typeof card.cmc==='number'?card.cmc:(typeof f0.cmc==='number'?f0.cmc:0),
    type_line:typeLine,front_type:frontType,back_type:f1?String(f1.type_line||''):'',
    oracle:oracle,colors:card.colors||f0.colors||[],ci:Array.isArray(card.color_identity)?card.color_identity:[],
    produced:Array.isArray(card.produced_mana)?card.produced_mana:[],keywords:Array.isArray(card.keywords)?card.keywords:[],
    gc:card.game_changer===true,legal:card.legalities&&card.legalities.commander||'unknown',
    usd:price?Number(price):null,rarity:card.rarity||'',set:card.set||'',num:card.collector_number||'',
    img:img.normal||img.large||'',small:img.small||img.normal||'',art:img.art_crop||'',
    back:back?(back.normal||''):'',uri:card.scryfall_uri||'',rank:typeof card.edhrec_rank==='number'?card.edhrec_rank:null,
    setName:card.set_name||'',artist:card.artist||f0.artist||'',released:card.released_at||'',
    parts:(Array.isArray(card.all_parts)?card.all_parts:[]).filter(function(p){return p&&p.component==='token'&&p.id;}).map(function(p){return {id:String(p.id),name:String(p.name||'')};}).slice(0,12)
  };
}

/* ---------- Classificação automática ---------- */
function isType(c,word){return lc(c.front_type||c.type_line).indexOf(word)>=0;}
function analyze(c){
  var o=lc(c.oracle),front=lc(c.front_type||c.type_line),back=lc(c.back_type);
  var land=front.indexOf('land')>=0;
  var mdfcLand=!land&&back.indexOf('land')>=0;
  var creature=front.indexOf('creature')>=0,artifact=front.indexOf('artifact')>=0,enchant=front.indexOf('enchantment')>=0;
  var instant=front.indexOf('instant')>=0,sorcery=front.indexOf('sorcery')>=0,pw=front.indexOf('planeswalker')>=0;
  var basic=front.indexOf('basic')>=0;
  var r={};
  /* Fonte de mana */
  var produced=(c.produced||[]).filter(function(x){return COLORS5.indexOf(x)>=0||x==='C';});
  var colors={W:0,U:0,B:0,R:0,G:0,C:0},any=false;
  produced.forEach(function(x){colors[x]=1;});
  if(COLORS5.every(function(k){return colors[k];})||/mana of any (one )?color|any color of mana/.test(o))any=true;
  var fetchLand=false;
  if(land&&!produced.length&&/search your library for/.test(o)){
    fetchLand=true;
    if(/basic land card/.test(o)&&!/(plains|island|swamp|mountain|forest) card/.test(o))any=true;
    [['plains','W'],['island','U'],['swamp','B'],['mountain','R'],['forest','G']].forEach(function(p){if(o.indexOf(p[0])>=0)colors[p[1]]=1;});
  }
  var amount=1;
  var addClause=(o.match(/add ([^.]*)/)||[])[1]||'';
  if(addClause){
    var syms=(addClause.match(/\{[wubrgc]\}/g)||[]).length;
    if(/^two mana|add two mana/.test(addClause))syms=Math.max(syms,2);
    if(/^three mana/.test(addClause))syms=Math.max(syms,3);
    if(syms>1&&!/ or /.test(addClause.split(',')[0]))amount=Math.min(3,syms);
  }
  var source=land||fetchLand||(produced.length>0&&/\badd\b/.test(o));
  /* Entra virado */
  var tappedText=/(enters|enters the battlefield) tapped/.test(o)||/onto the battlefield tapped/.test(o);
  var conditional=/ unless |if you don't|you may pay/.test(o);
  var entersTapped=tappedText&&!conditional;
  /* Funções */
  var landSearch=/search your library for [^.]*land card[^.]*onto the battlefield|put (a|up to \w+) land cards? from your hand onto the battlefield/.test(o);
  var treasure=/create[^.]*treasure/.test(o);
  var rampKind='';
  if(!land){
    if((instant||sorcery)&&(/\badd \{/.test(o)||/\badd (one|two|three) mana/.test(o)))rampKind='burst';
    else if((instant||sorcery)&&treasure&&!landSearch)rampKind='burst';
    else if(landSearch)rampKind='land';
    else if(source&&creature)rampKind='dork';
    else if(source&&artifact)rampKind='rock';
    else if(source)rampKind='other';
  }
  r.ramp=!!rampKind;
  r.draw=/\bdraws? (a|one|two|three|four|five|six|seven|x|that many|cards?)\b/.test(o)&&!/^target opponent draws/.test(o)||/exile the top [^.]* (you may|until end of turn,? you may) (play|cast)/.test(o)||/\binvestigate\b/.test(o)||/\bconnive/.test(o);
  if(land&&!/draw/.test(o))r.draw=false;
  r.counter=/counter target ([a-z ]*)?(spell|ability)/.test(o);
  r.wipe=/(destroy|exile) (all|each) (creatures|nonland|permanents|artifacts|enchantments|other creatures|creature)/.test(o)||/(destroy|exile) all /.test(o)||/return all (nonland|creatures|permanents)/.test(o)||/deals? \d+ damage to each creature/.test(o)||/all creatures get -/.test(o)||/each player sacrifices (all|that many|\w+) (creatures|nonland)/.test(o);
  r.removal=!r.wipe&&(/(destroy|exile) (up to one )?target/.test(o)||/return target (creature|nonland|artifact|enchantment|permanent|planeswalker)[^.]* to (its|their) owner'?s? hand/.test(o)||/deals? (\d+|x) damage to (any target|target creature|target planeswalker)/.test(o)||/(target player|each opponent|target opponent) sacrifices/.test(o)||/fights? (target|up to one target)/.test(o)||/target creature gets -\d+\/-\d+|target creature gets -x\/-x/.test(o));
  if(r.counter&&!/(destroy|exile) target/.test(o))r.removal=false;
  var tutorClause=(o.match(/search your library for ([^.]*)/)||[])[1]||'';
  r.tutor=!!tutorClause&&!/\bland\b|basic/.test(tutorClause)||/search your library for (a|an|up to \w+) cards?\b/.test(o);
  var tutorMask=0,tutorTop=false;
  if(r.tutor){
    [['creature',1],['artifact',2],['enchantment',4],['instant',8],['sorcery',16],['planeswalker',32]].forEach(function(w){if(tutorClause.indexOf(w[0])>=0)tutorMask|=w[1];});
    if(!tutorMask)tutorMask=63;
    tutorTop=/put (the|that) card on top|on top of your library|on top of it/.test(o);
  }
  r.protection=/(gains?|have|has|get) (hexproof|indestructible|shroud|protection)/.test(o)||/phases? out/.test(o);
  r.recursion=/(return|put) [^.]*from your graveyard (to|onto)/.test(o)||/return [^.]*from a graveyard/.test(o)||/cast [^.]*from your graveyard/.test(o)||/\bflashback\b|\bescape\b|\bunearth\b/.test(o);
  r.wincon=/you win the game|loses the game|each opponent loses \d+ life for each|infinite/.test(o);
  r.stax=/(your opponents|each opponent|players) can't|spells your opponents cast cost|don't untap during (their|its controller's)|opponents control enter (the battlefield )?tapped|each player can't cast more than/.test(o);
  if(land){r.removal=r.removal&&/destroy target/.test(o);r.wipe=false;}
  var mld=/destroy all lands|destroy all nonbasic lands|each player sacrifices (all|\w+) lands|lands don't untap|nonbasic lands are mountains|destroy each land/.test(o);
  var extraTurn=/take an extra turn|takes an extra turn/.test(o);
  var anyNumber=/a deck can have any number of cards named|a deck can have up to \w+ cards named/.test(o);
  var drawsN=0;
  if(r.draw){var m=o.match(/draws? (a|one|two|three|four|x)\b/);drawsN=m?({a:1,one:1,two:2,three:3,four:4,x:2})[m[1]]:1;}
  return {land:land,mdfcLand:mdfcLand,basic:basic,creature:creature,artifact:artifact,enchant:enchant,instant:instant,sorcery:sorcery,pw:pw,
    battle:front.indexOf('battle')>=0,legendary:front.indexOf('legendary')>=0,
    source:!!source,colors:colors,any:any,amount:amount,entersTapped:entersTapped||(land&&fetchLand&&/tapped/.test(o)),
    rampKind:rampKind,roles:r,tutorMask:tutorMask,tutorTop:tutorTop,mld:mld,extraTurn:extraTurn,anyNumber:anyNumber,drawsN:drawsN};
}
/* Funções efetivas: automático + ajustes do usuário (tags) */
function rolesOf(entry){
  var a=entry._a||(entry._a=analyze(entry.c));
  var out={};
  ROLES.forEach(function(r){
    var t=entry.tags&&entry.tags[r.key];
    out[r.key]=t===true?true:t===false?false:!!a.roles[r.key];
  });
  return out;
}
function typeGroup(c){
  var t=lc(c.front_type||c.type_line);
  if(t.indexOf('land')>=0)return 'Terreno';
  if(t.indexOf('creature')>=0)return 'Criatura';
  if(t.indexOf('planeswalker')>=0)return 'Planeswalker';
  if(t.indexOf('battle')>=0)return 'Batalha';
  if(t.indexOf('instant')>=0)return 'Instantânea';
  if(t.indexOf('sorcery')>=0)return 'Feitiço';
  if(t.indexOf('artifact')>=0)return 'Artefato';
  if(t.indexOf('enchantment')>=0)return 'Encantamento';
  return 'Outro';
}

/* ---------- Custo de mana ---------- */
function pips(cost){
  var out={W:0,U:0,B:0,R:0,G:0,C:0};
  (String(cost||'').match(/\{[^}]+\}/g)||[]).forEach(function(m){
    var s=m.slice(1,-1).toUpperCase();
    if(out[s]!==undefined&&s!=='C'){out[s]++;return;}
    if(s==='C'){out.C++;return;}
    if(s.indexOf('/')>=0)COLORS5.forEach(function(k){if(s.indexOf(k)>=0)out[k]++;});
  });
  return out;
}
function costTokens(cost){return (String(cost||'').match(/\{[^}]+\}|\s\/\/\s/g)||[]).map(function(t){return t.trim()==='//'?'//':t.slice(1,-1).toUpperCase();});}

/* ---------- Lista de texto ---------- */
function parseDecklist(text){
  var lines=String(text||'').split(/\r?\n/),section='main',out={commanders:[],main:[],skipped:[]};
  lines.forEach(function(raw){
    var line=raw.replace(/\s+#.*$/,'').trim();
    if(!line||/^\/\//.test(line))return;
    var head=line.replace(/[:\s]+$/,'').toLowerCase();
    if(/^(commanders?|comandantes?)(\s*\(\d+\))?$/.test(head)){section='cmd';return;}
    if(/^(deck|main|mainboard|maindeck|companion|baralho)(\s*\(\d+\))?$/.test(head)){section='main';return;}
    if(/^(sideboard|maybeboard|maybe|considering|tokens?|sideboard \(\d+\))(\s*\(\d+\))?$/.test(head)){section='skip';return;}
    var m=line.match(/^(\d+)\s*x?\s+(.+)$/i);
    var qty=m?parseInt(m[1],10):1,name=m?m[2]:line;
    var isCmd=section==='cmd';
    if(/\*cmdr\*|\[commander/i.test(name)){isCmd=true;}
    name=name.replace(/\s*\[[^\]]*\]/g,'').replace(/\s*\^[^^]*\^/g,'').replace(/\s*\*[A-Za-z]+\*/g,'')
      .replace(/\s+\([A-Za-z0-9]{2,8}\)(\s+[A-Za-z0-9★\-]+)?\s*$/,'').replace(/\s+[A-Za-z0-9]{2,6}-\d+[a-z]?$/,'').trim();
    if(!name||qty<1)return;
    if(section==='skip'){out.skipped.push(name);return;}
    (isCmd?out.commanders:out.main).push({name:name,qty:Math.min(qty,99)});
  });
  /* Junta repetidos */
  function merge(list){var map={},res=[];list.forEach(function(e){var k=lc(e.name);if(map[k])map[k].qty+=e.qty;else{map[k]={name:e.name,qty:e.qty};res.push(map[k]);}});return res;}
  out.main=merge(out.main);out.commanders=merge(out.commanders).slice(0,2);
  return out;
}
function exportText(deck){
  var lines=[];
  if(deck.commanders.length){lines.push('Commander');deck.commanders.forEach(function(c){lines.push('1 '+c.name);});lines.push('');lines.push('Deck');}
  sortedEntries(deck).forEach(function(e){lines.push(e.qty+' '+e.c.name);});
  return lines.join('\n');
}
function sortedEntries(deck){
  return deck.cards.slice().sort(function(a,b){
    var ga=TYPE_ORDER.indexOf(typeGroup(a.c)),gb=TYPE_ORDER.indexOf(typeGroup(b.c));
    return ga-gb||a.c.cmc-b.c.cmc||a.c.name.localeCompare(b.c.name);
  });
}

/* ---------- Estatísticas ---------- */
function identityOf(deck){var set={};deck.commanders.forEach(function(c){(c.ci||[]).forEach(function(k){set[k]=1;});});return COLORS5.filter(function(k){return set[k];});}
function stats(deck){
  var s={cards:0,commanders:deck.commanders.length,lands:0,nonlands:0,mvSum:0,curve:[0,0,0,0,0,0,0,0],types:{},roles:{},
    pips:{W:0,U:0,B:0,R:0,G:0,C:0},sources:{W:0,U:0,B:0,R:0,G:0,C:0,any:0,total:0},tapped:0,usd:0,priced:0,unpriced:0,gc:[],mld:[],extra:[],mdfc:0,expensive:[]};
  ROLES.forEach(function(r){s.roles[r.key]=0;});
  TYPE_ORDER.forEach(function(t){s.types[t]=0;});
  deck.cards.forEach(function(e){
    var a=e._a||(e._a=analyze(e.c)),q=e.qty,roles=rolesOf(e);
    s.cards+=q;s.types[typeGroup(e.c)]+=q;
    if(a.land){s.lands+=q;if(a.entersTapped)s.tapped+=q;}
    else{s.nonlands+=q;s.mvSum+=e.c.cmc*q;s.curve[Math.min(7,Math.floor(e.c.cmc))]+=q;var p=pips(e.c.mana_cost);COLORS5.concat('C').forEach(function(k){s.pips[k]+=p[k]*q;});}
    if(a.mdfcLand)s.mdfc+=q;
    ROLES.forEach(function(r){if(roles[r.key])s.roles[r.key]+=q;});
    if(a.source&&(a.land||a.rampKind!=='burst')){
      s.sources.total+=q;if(a.any)s.sources.any+=q;
      COLORS5.concat('C').forEach(function(k){if(a.colors[k]||a.any&&k!=='C')s.sources[k]+=q;});
    }
    if(e.c.usd!=null){s.usd+=e.c.usd*q;s.priced++;s.expensive.push({name:e.c.name,usd:e.c.usd});}else if(!a.basic)s.unpriced++;
    if(e.c.gc)s.gc.push(e.c.name);if(a.mld)s.mld.push(e.c.name);if(a.extraTurn)s.extra.push(e.c.name);
  });
  deck.commanders.forEach(function(c){
    s.cards+=1;if(c.usd!=null){s.usd+=c.usd;s.expensive.push({name:c.name,usd:c.usd});}
    if(c.gc)s.gc.push(c.name);
  });
  s.avgMv=s.nonlands?s.mvSum/s.nonlands:0;

/* ---------- Validação de Commander ---------- */

  if(/choose a background/.test(oa)&&tb.indexOf('background')>=0||/choose a background/.test(ob)&&ta.indexOf('background')>=0)return true;
  if(ka.indexOf("doctor's companion")>=0&&/time lord doctor/.test(tb)||kb.indexOf("doctor's companion")>=0&&/time lord doctor/.test(ta))return true;

function validate(deck){
  var issues=[],id=identityOf(deck),s=stats(deck);

  deck.commanders.forEach(function(c){
    if(!canBeCommander(c))issues.push({level:'error',text:c.name+' não pode ser comandante.'});
    if(c.legal==='banned')issues.push({level:'error',text:c.name+' está banido como comandante.'});
  });
  if(deck.commanders.length===2&&!pairOk(deck.commanders[0],deck.commanders[1]))issues.push({level:'error',text:'Esses dois comandantes não formam par (Parceiro, Escolha um Antecedente ou similar).'});

  var names={};
  deck.cards.forEach(function(e){
    var a=e._a||(e._a=analyze(e.c));
    if(e.qty>1&&!a.basic&&!a.anyNumber)issues.push({level:'error',text:e.c.name+' aparece '+e.qty+' vezes. Fora básicos, cada carta entra uma vez.'});
    if(e.c.legal==='banned')issues.push({level:'error',text:e.c.name+' está banida em Commander.'});
    else if(e.c.legal==='not_legal')issues.push({level:'error',text:e.c.name+' não é legal em Commander.'});
    if(deck.commanders.length){
      var out=(e.c.ci||[]).filter(function(k){return id.indexOf(k)<0;});
      if(out.length)issues.push({level:'error',text:e.c.name+' tem '+out.join('')+' fora da identidade de cor do comandante.'});
    }

  deck.commanders.forEach(function(c){if(names[lc(c.name)])issues.push({level:'error',text:c.name+' está no deck e na zona de comando.'});});

/* ---------- Bracket ---------- */
function bracket(deck,combos){
  var s=stats(deck),reasons=[],floor=2;
  if(s.gc.length>0&&s.gc.length<=3){floor=3;reasons.push(s.gc.length+' Game Changer'+(s.gc.length>1?'s':'')+': '+s.gc.join(', ')+'.');}
  if(s.gc.length>3){floor=4;reasons.push(s.gc.length+' Game Changers (o bracket 3 aceita até 3).');}
  if(s.mld.length){floor=4;reasons.push('Destruição de terrenos em massa: '+s.mld.join(', ')+'.');}
  if(s.extra.length>=3){floor=Math.max(floor,4);reasons.push(s.extra.length+' cartas de turno extra, risco de encadear.');}
  else if(s.extra.length)reasons.push('Turno extra: '+s.extra.join(', ')+'. Tudo bem até o bracket 3, desde que não encadeie.');
  var two=null;
  if(Array.isArray(combos)){
    two=combos.filter(function(c){return c.pieces.length===2;});
    if(two.length){floor=Math.max(floor,3);reasons.push(two.length+' combo'+(two.length>1?'s':'')+' de duas cartas. No bracket 3 só valem se não vencerem antes do turno 6; acima disso, bracket 4.');}

  if(!reasons.length)reasons.push('Sem Game Changers, destruição de terrenos em massa ou turnos extras encadeados.');
  return {floor:floor,reasons:reasons,gc:s.gc,mld:s.mld,extra:s.extra,twoCard:two};
}

/* ---------- Hipergeométrica ---------- */
function logChoose(n,k){if(k<0||k>n)return -Infinity;k=Math.min(k,n-k);var s=0;for(var i=1;i<=k;i++)s+=Math.log((n-k+i)/i);return s;}

  N=Math.max(0,N|0);K=Math.max(0,Math.min(N,K|0));n=Math.max(0,Math.min(N,n|0));x=Math.max(0,x|0);

function cardsSeen(turn,onDraw){return 7+Math.max(0,turn-1)+(onDraw?1:0);}

  var acc=simulate(cards,{check:true,maxTurn:T,onDraw:onDraw,need:[0,0,0,0,0],tutors:false},rand,games);
  var N=cards.length,K=cards.filter(function(c){return c.land||c.mdfc;}).length,rows=[];
  for(var t=1;t<=T;t++){
    var exact=hyperAtLeast(N,K,cardsSeen(t,onDraw),t),sim=acc.landSeen[t-1]/games,se=Math.sqrt(Math.max(exact*(1-exact),1e-9)/games);
    rows.push({turn:t,exact:exact,sim:sim,diff:sim-exact,z:(sim-exact)/se,ok:Math.abs(sim-exact)<=3*se+1e-9});
  }
  return {rows:rows,games:games,N:N,K:K,ok:rows.every(function(r){return r.ok;})};
}

function colorsOk(counts,need){

function keepScore(hand,style){

  hand.forEach(function(c){

function bottomPick(hand,n){

    if(lands>4){idx=hand.findIndex(function(c){return c.land;});}
    else{var best=-1;hand.forEach(function(c,i){if(c.land&&lands<=3)return;var v=c.land?-1:c.cmc-(c.roles.ramp?2:0);if(idx<0||v>best){best=v;idx=i;}});}

function simulate(cards,opt,rand,games,acc){

  for(var g=0;g<games;g++){

    for(;;){

      var lands=hand.filter(function(c){return c.land;}).length;
      var keep=opt.check||attempt>=3||lands>=opt.minLands&&lands<=opt.maxLands&&keepScore(hand,opt.style)>=(opt.style==='turbo'?6:5);

function tutorTarget(tc,lib,seen,opt,mana,turn){

    if(avail.length){best=avail[0];bestMiss=miss.length;}
  });
  if(best)return lib.findIndex(function(c){return c.name===best&&fits(c);});

    var idx=-1,cm=99;
    lib.forEach(function(c,i){if(fits(c)&&(c.kind==='rock'||c.kind==='dork'||c.kind==='land'||c.kind==='other')&&c.cmc<cm){cm=c.cmc;idx=i;}});

/* ---------- Base de mana ---------- */
/* Para cada cor, a menor quantidade de fontes S que garante ver k fontes até o turno
   do custo da carta, com a confiança pedida. Hipergeométrica exata, sem mulligan. */
function sourcesNeeded(N,k,turn,conf,onDraw){
  var n=cardsSeen(turn,onDraw);
  for(var S=k;S<=N;S++)if(hyperAtLeast(N,S,n,k)>=conf)return S;
  return null;
}
function manaBase(deck,conf,onDraw){
  conf=conf||0.9;
  var s=stats(deck),N=Math.max(1,s.cards-s.commanders),req={};
  function consider(c,isCmd){
    var p=pips(c.mana_cost),mv=Math.max(1,Math.floor(c.cmc||0));
    COLORS5.forEach(function(k){
      if(!p[k])return;
      var need=sourcesNeeded(N,p[k],mv,conf,onDraw),r=req[k];
      var item={card:c.name,pips:p[k],turn:mv,need:need,cmd:!!isCmd};
      if(!r){req[k]={color:k,worst:item,cards:[item]};return;}
      r.cards.push(item);
      if(need===null||r.worst.need!==null&&need>r.worst.need)r.worst=item;
    });
  }
  deck.commanders.forEach(function(c){consider(c,true);});
  deck.cards.forEach(function(e){var a=e._a||(e._a=analyze(e.c));if(!a.land)consider(e.c,false);});
  return COLORS5.filter(function(k){return req[k];}).map(function(k){
    var r=req[k];r.cards.sort(function(a,b){return (b.need===null?999:b.need)-(a.need===null?999:a.need);});
    var cmd=r.cards.filter(function(x){return x.cmd;}).sort(function(a,b){return (b.need||999)-(a.need||999);})[0]||null;
    var needs=r.cards.map(function(x){return x.need===null?999:x.need;}).sort(function(a,b){return a-b;});
    var median=needs[Math.floor((needs.length-1)/2)];
    var ref=cmd?cmd.need:median;
    var covered=r.cards.filter(function(x){return x.need!==null&&x.need<=s.sources[k];}).length;
    return {color:k,need:r.worst.need,driver:r.worst,top:r.cards.slice(0,4),have:s.sources[k],count:r.cards.length,cmd:cmd,median:median===999?null:median,ref:ref===999?null:ref,covered:covered};
  });
}

/* ---------- Coleção em CSV ou texto ---------- */
function splitCSV(line,sep){
  var out=[],cur='',q=false;
  for(var i=0;i<line.length;i++){
    var ch=line[i];
    if(q){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true;
    else if(ch===sep){out.push(cur);cur='';}
    else cur+=ch;
  }
  out.push(cur);return out.map(function(x){return x.trim();});
}

function addGame(g){var c=cleanGame(g);if(!c)return null;games.unshift(c);if(games.length>2000)games.length=2000;saveGames();emit('games');return c;}
function updateGame(id,patch){var g=games.find(function(x){return x.id===id;});if(!g)return;var c=cleanGame(Object.assign({},g,patch));Object.assign(g,c);saveGames();emit('games');}
function removeGame(id){games=games.filter(function(g){return g.id!==id;});saveGames();emit('games');}

/* ---------- Backup ---------- */
function exportLibrary(){return JSON.stringify({format:'commander-suite-decks',version:1,exportedAt:new Date().toISOString(),decks:lib.decks},strip,2);}
function exportAll(table){
  return JSON.stringify({format:'commander-suite-backup',version:1,exportedAt:new Date().toISOString(),decks:lib.decks,active:lib.active,collection:lib.collection,settings:lib.settings,games:games,table:table||null},strip,2);
}
function importLibrary(raw){
  var decks=raw&&(raw.format==='commander-suite-decks'||raw.format==='commander-suite-backup')&&Array.isArray(raw.decks)?raw.decks:raw&&raw.format==='commander-suite-deck'&&raw.deck?[raw.deck]:null;
  if(!decks)throw new Error('format');
  var have={};lib.decks.forEach(function(d){have[d.id]=d;});
  var added=[];
  decks.slice(0,300).forEach(function(d){
    var c=cleanDeck(d);if(!c)return;
    if(have[c.id]){if(c.updated>have[c.id].updated){Object.assign(have[c.id],c);added.push(have[c.id]);}return;}
    lib.decks.push(c);added.push(c);
  });
  var gamesAdded=0;
  if(raw.format==='commander-suite-backup'){
    if(raw.collection)addOwned(cleanCollection(raw.collection),false);
    if(raw.settings&&!lib.settings.rate)lib.settings=cleanSettings(raw.settings);
    var ids={};games.forEach(function(g){ids[g.id]=1;});
    (Array.isArray(raw.games)?raw.games:[]).forEach(function(g){var c=cleanGame(g);if(c&&!ids[c.id]){games.push(c);gamesAdded++;}});
    games.sort(function(a,b){return b.at-a.at;});saveGames();
  }
  if(added.length)lib.active=added[0].id;
  save();emit('list',lib.active);emit('games');
  return {decks:added.length,games:gamesAdded};
}

/* ---------- Cache de cartas ---------- */
var cache=null;
function cacheGet(name){if(!cache){try{cache=JSON.parse(localStorage.getItem(CACHE_KEY)||'{}')||{};}catch(e){cache={};}}return cache[lc(name)]||null;}
function cachePut(s){
  if(!cache)cacheGet('');
  [s.name].concat(s.name.indexOf(' // ')>0?[s.name.split(' // ')[0]]:[]).forEach(function(n){cache[lc(n)]=s;});
  var keys=Object.keys(cache);if(keys.length>700)keys.slice(0,keys.length-600).forEach(function(k){delete cache[k];});
  try{localStorage.setItem(CACHE_KEY,JSON.stringify(cache));}catch(e){try{localStorage.removeItem(CACHE_KEY);}catch(_){}cache={};}
}

/* ---------- Scryfall ---------- */
var SF='https://api.scryfall.com',lastCall=0;
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
async function sfFetch(path,init,tries){
  var wait=lastCall+110-Date.now();if(wait>0)await sleep(wait);lastCall=Date.now();
  init=init||{};init.headers=Object.assign({'Accept':'application/json'},init.headers||{});
  var res;
  try{res=await fetch(path.indexOf('https://')===0?path:SF+path,init);}catch(e){var err=new Error('Sem conexão com o Scryfall. Confira a internet e tente de novo.');err.network=true;throw err;}
  if(res.status===429&&(tries||0)<3){await sleep(1200);return sfFetch(path,init,(tries||0)+1);}
  return res;
}
function clean(card){var s=cleanSlim(C.slim(card));return s;}
var acCtrl=null;
async function autocomplete(q){
  if(acCtrl)acCtrl.abort();acCtrl=typeof AbortController!=='undefined'?new AbortController():null;
  var res=await fetch(SF+'/cards/autocomplete?q='+encodeURIComponent(q),{headers:{'Accept':'application/json'},signal:acCtrl&&acCtrl.signal});
  var data=await res.json();return (data.data||[]).slice(0,12);
}
async function named(name,fuzzy){
  var hit=cacheGet(name);if(hit)return hit;
  var res=await sfFetch('/cards/named?'+(fuzzy?'fuzzy=':'exact=')+encodeURIComponent(name));
  if(!res.ok&&!fuzzy)res=await sfFetch('/cards/named?fuzzy='+encodeURIComponent(name));
  if(!res.ok)throw new Error('Carta não encontrada: '+name+'.');
  var s=clean(await res.json());cachePut(s);return s;
}
async function byId(id){
  var res=await sfFetch('/cards/'+encodeURIComponent(id));
  if(!res.ok)throw new Error('Carta não encontrada no Scryfall.');
  return clean(await res.json());
}
async function collection(names,progress){
  var found={},missing=[],todo=[];
  names.forEach(function(n){var h=cacheGet(n);if(h)found[lc(n)]=h;else todo.push(n);});
  var done=names.length-todo.length;if(progress)progress(done,names.length);
  for(var i=0;i<todo.length;i+=75){
    var batch=todo.slice(i,i+75);
    var res=await sfFetch('/cards/collection',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifiers:batch.map(function(n){return {name:n};})})});
    if(!res.ok)throw new Error('O Scryfall recusou a busca ('+res.status+'). Tente de novo em instantes.');
    var data=await res.json(),byName={};
    (data.data||[]).forEach(function(card){
      var s=clean(card);cachePut(s);
      byName[lc(s.name)]=s;byName[lc(s.name.split(' // ')[0])]=s;
    });
    batch.forEach(function(n){var s=byName[lc(n)]||byName[lc(n.split(' // ')[0])];if(s)found[lc(n)]=s;});
    done+=batch.length;if(progress)progress(done,names.length);
  }
  var rest=names.filter(function(n){return !found[lc(n)];});
  for(var j=0;j<rest.length&&j<25;j++){
    try{found[lc(rest[j])]=await named(rest[j].split(' // ')[0],true);}catch(e){if(e.network)throw e;missing.push(rest[j]);}
  }
  rest.slice(25).forEach(function(n){missing.push(n);});
  return {found:found,missing:missing};
}
/* Atualiza preço, legalidade e Game Changer mantendo a edição escolhida. */
async function refreshDeck(id,progress){
  var d=get(id);if(!d)return 0;
  var all=d.commanders.concat(d.cards.map(function(e){return e.c;})).concat(d.maybe.map(function(e){return e.c;}));
  var ids=all.filter(function(c){return /^[0-9a-f-]{36}$/.test(c.id);}).map(function(c){return c.id;});
  var byIdMap={},done=0;
  for(var i=0;i<ids.length;i+=75){
    var batch=ids.slice(i,i+75);
    var res=await sfFetch('/cards/collection',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifiers:batch.map(function(x){return {id:x};})})});
    if(!res.ok)throw new Error('O Scryfall recusou a atualização ('+res.status+').');
    var data=await res.json();(data.data||[]).forEach(function(card){var s=clean(card);byIdMap[s.id]=s;});
    done+=batch.length;if(progress)progress(done,ids.length);
  }
  var n=0;
  mutate(id,'Atualizar dados das cartas',function(dd){
    dd.commanders=dd.commanders.map(function(c){var s=byIdMap[c.id];if(s){n++;return s;}return c;});
    dd.cards.concat(dd.maybe).forEach(function(e){var s=byIdMap[e.c.id];if(s){e.c=s;e._a=null;n++;}});
  });
  return n;
}
var SORTS={edhrec:'edhrec',name:'name',cmc:'cmc',usd:'usd',released:'released'};
async function search(q,opt){
  opt=opt||{};
  var path=opt.next||('/cards/search?q='+encodeURIComponent(q)+'&order='+(SORTS[opt.order]||'edhrec')+(opt.order==='usd'?'&dir=desc':'')+(opt.unique?'&unique='+opt.unique:''));
  if(opt.next&&opt.next.indexOf(SF+'/')!==0)throw new Error('Endereço inválido.');
  var res=await sfFetch(path);
  if(res.status===404)return {cards:[],total:0,next:null};
  var data=await res.json();
  if(!res.ok){var err=new Error(data&&data.details?String(data.details):'Busca inválida.');err.status=res.status;throw err;}
  return {cards:(data.data||[]).map(clean).filter(Boolean),total:data.total_cards||0,next:data.has_more?data.next_page:null,warnings:data.warnings||[]};
}
async function prints(card){
  var q=card.oid?'oracleid:'+card.oid:'!"'+card.name.split(' // ')[0].replace(/"/g,'')+'"';
  var r=await search(q+' game:paper',{unique:'prints',order:'released'});
  var list=r.cards,next=r.next,guard=0;
  while(next&&guard++<4){var more=await search('',{next:next});list=list.concat(more.cards);next=more.next;}
  return list;
}
async function rulings(id){
  var res=await sfFetch('/cards/'+encodeURIComponent(id)+'/rulings');
  if(!res.ok)throw new Error('Não deu para carregar as regras.');
  var data=await res.json();
  return (data.data||[]).map(function(r){return {date:String(r.published_at||''),text:String(r.comment||''),source:String(r.source||'')};});
}

/* ---------- EDHREC ---------- */
function edhrecSlug(name){
  return lc(name.split(' // ')[0]).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}
async function edhrec(commanders){
  if(!commanders.length)throw new Error('Escolha o comandante primeiro.');
  var slugs=commanders.map(function(c){return edhrecSlug(c.name);});
  var tries=slugs.length>1?[slugs.slice().sort().join('-'),slugs.join('-'),slugs[1]+'-'+slugs[0]]:[slugs[0]];
  var data=null,lastErr=null;
  for(var i=0;i<tries.length&&!data;i++){
    try{
      var res=await fetch('https://json.edhrec.com/pages/commanders/'+tries[i]+'.json',{headers:{'Accept':'application/json'}});
      if(res.ok)data=await res.json();else lastErr=new Error('O EDHREC não tem uma página para esse comandante.');
    }catch(e){lastErr=new Error('Não deu para falar com o EDHREC. Ele pode estar bloqueando acesso direto pelo navegador; as sugestões por função continuam funcionando.');}
  }
  if(!data)throw lastErr;
  if(data.redirect&&typeof data.redirect==='string'){
    try{var r2=await fetch('https://json.edhrec.com/pages'+data.redirect.replace(/^\/?(pages)?/,'/').replace(/\/+/,'/')+'.json');if(r2.ok)data=await r2.json();}catch(e){}
  }
  var lists=(data.container&&data.container.json_dict&&data.container.json_dict.cardlists)||data.cardlists||[];
  var out=[];
  lists.forEach(function(l){
    var views=l.cardviews||l.cards||[];
    var cards=views.map(function(v){
      var n=v.name||v.sanitized_wo||'';
      var decks=Number(v.num_decks||v.inclusion||0),pot=Number(v.potential_decks||0);
      return {name:String(n),synergy:typeof v.synergy==='number'?v.synergy:null,pct:pot?decks/pot:null,decks:decks};
    }).filter(function(c){return c.name;});
    if(cards.length)out.push({header:String(l.header||l.tag||'Cartas'),tag:String(l.tag||''),cards:cards});
  });
  var total=Number(data.num_decks_avg||data.num_decks||(data.container&&data.container.json_dict&&data.container.json_dict.card&&data.container.json_dict.card.num_decks)||0);
  return {lists:out,decks:total,url:'https://edhrec.com/commanders/'+tries[0]};
}

/* ---------- Commander Spellbook ---------- */
var SB='https://backend.commanderspellbook.com';
function deckRequest(d){
  return {commanders:d.commanders.map(function(c){return {card:c.name};}),main:d.cards.map(function(e){return {card:e.c.name,quantity:e.qty};})};
}
async function sbPost(path,d){
  var res;
  try{res=await fetch(SB+path,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(deckRequest(d))});}
  catch(e){throw new Error('Não deu para falar com o Commander Spellbook. Confira a internet; se persistir, o site pode estar fora do ar.');}
  if(res.status===429)throw new Error('O Commander Spellbook pediu uma pausa. Espere um minuto e tente de novo.');
  if(!res.ok)throw new Error('O Commander Spellbook respondeu com erro '+res.status+'.');
  return res.json();
}
function variant(v,deckNames){
  var pieces=(v.uses||[]).map(function(u){return u.card&&u.card.name;}).filter(Boolean);
  var templates=(v.requires||[]).map(function(r){return r.template&&r.template.name;}).filter(Boolean);
  return {id:String(v.id||''),pieces:pieces,templates:templates,produces:(v.produces||[]).map(function(p){return p.feature&&p.feature.name;}).filter(Boolean),
    description:String(v.description||''),prereq:String(v.easyPrerequisites||'')+(v.notablePrerequisites?'\n'+v.notablePrerequisites:''),
    mana:String(v.manaNeeded||''),bracket:String(v.bracketTag||''),identity:String(v.identity||''),
    missing:deckNames?pieces.filter(function(p){return !deckNames[lc(p)];}):[]};
}
async function findCombos(d){
  var data=await sbPost('/find-my-combos',d),r=data&&data.results||{};
  var names={};d.cards.forEach(function(e){names[lc(e.c.name)]=1;});d.commanders.forEach(function(c){names[lc(c.name)]=1;});
  return {included:(r.included||[]).map(function(v){return variant(v,names);}),
    almost:(r.almostIncluded||[]).map(function(v){return variant(v,names);}).filter(function(v){return v.missing.length===1;}).slice(0,40),
    fetchedAt:Date.now()};
}
var TAGS={E:'Exhibition',C:'Core',O:'Oddball',P:'Powerful',S:'Spicy',R:'Ruthless',B:'Banida'};
async function estimateBracket(d){
  var data=await sbPost('/estimate-bracket',d);
  var tag=String(data&&data.bracketTag||'');
  return {tag:tag,label:TAGS[tag]||tag||'Sem classificação',
    gc:(data.cards||[]).filter(function(c){return c.gameChanger;}).map(function(c){return c.card&&c.card.name;}),
    twoCard:(data.combos||[]).filter(function(c){return c.definitelyTwoCard;}).map(function(c){return variant(c.combo||{});})};
}

global.DeckStore={load:load,save:save,subscribe:subscribe,list:function(){return lib.decks;},get:get,active:active,setActive:setActive,
  create:create,remove:remove,duplicate:duplicate,mutate:mutate,undo:undoDeck,canUndo:canUndo,exportLibrary:exportLibrary,exportAll:exportAll,importLibrary:importLibrary,
  ok:function(){return storageOK;},uid:uid,cleanSlim:cleanSlim,
  owned:owned,setOwned:setOwned,addOwned:addOwned,collectionSize:collectionSize,exportCollection:exportCollection,clearCollection:clearCollection,
  settings:settings,setSettings:setSettings,fetchRate:fetchRate,
  games:listGames,addGame:addGame,updateGame:updateGame,removeGame:removeGame,
  scryfall:{autocomplete:autocomplete,named:named,byId:byId,collection:collection,search:search,prints:prints,rulings:rulings,refreshDeck:refreshDeck},
  edhrec:edhrec,edhrecSlug:edhrecSlug,
  spellbook:{findCombos:findCombos,estimateBracket:estimateBracket}};
})(globalThis);

(function(){

var M=CommanderModel,KEY='commander-dark-table-v1',state=M.fresh(Date.now()),undoStack=[],eventLog=[],storageOK=true;

function icon(name){return '<svg aria-hidden="true" viewBox="0 0 24 24">'+(ICONS[name]||ICONS.sliders)+'</svg>';}
function duration(ms,long){var t=Math.floor(Math.max(0,ms)/1000),h=Math.floor(t/3600),m=Math.floor(t/60)%60,s=t%60;return (h||long?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(s).padStart(2,'0');}
function totalElapsed(){return state.elapsedMs+(state.timerRunning?Math.max(0,Date.now()-state.timerSince):0);}
function turnElapsed(){return state.turnElapsedMs+(state.timerRunning?Math.max(0,Date.now()-state.turnSince):0);}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function readSaved(){
 try{
   var raw=JSON.parse(localStorage.getItem(KEY));
   if(raw&&raw.format==='commander-dark'&&raw.version===1&&raw.state&&raw.state.schema===1){
     state=M.normalize(raw.state,Date.now());loaded=true;
     if(Array.isArray(raw.undo))undoStack=raw.undo.slice(-60).filter(function(x){return x&&x.before&&x.before.schema===1;}).map(function(x){return{id:String(x.id).slice(0,40),label:String(x.label).slice(0,250),before:M.normalize(x.before,Date.now())};});
     if(Array.isArray(raw.log))eventLog=raw.log.slice(-150).map(function(x){return{id:String(x.id||'').slice(0,40),text:String(x.text||'').slice(0,300),at:M.num(x.at,0,Date.now(),Date.now()),undone:x.undone===true};});
   }
 }catch(e){storageOK=false;}
 if(!loaded)state.timerRunning=true;
}
function persist(){
 try{
  localStorage.setItem(KEY,JSON.stringify({format:'commander-dark',version:1,state:state,undo:undoStack,log:eventLog}));
  storageOK=true;
 }catch(e){storageOK=false;}

}
function renderSave(){

 el.innerHTML='<span class="dot"></span><span>'+(storageOK?'Partida salva':'Salvamento indisponível')+'</span>';

function toast(message){
 $('toast').textContent=message;$('toast').classList.add('show');
 clearTimeout(toastTimer);toastTimer=setTimeout(function(){$('toast').classList.remove('show');},3300);
}
function buzz(){if(state.haptics&&navigator.vibrate)try{navigator.vibrate(8);}catch(e){}}
function commit(label,change,options){
 options=options||{};var before=M.clone(state);change();
 if(JSON.stringify(before)===JSON.stringify(state))return null;
 var last=undoStack[undoStack.length-1],id=options.group&&last&&last.id===options.group?last.id:newId();
 if(id!==options.group){
   undoStack.push({id:id,label:label,before:before});if(undoStack.length>60)undoStack.shift();
   eventLog.push({id:id,text:label,at:Date.now(),undone:false});if(eventLog.length>150)eventLog.shift();
 }else{
   last.label=label;var log=eventLog.find(function(x){return x.id===id;});if(log)log.text=label;
 }
 if(options.redraw){renderAll();if(modalContext&&options.rebuildModal)renderModal();}else refreshValues();

function undo(){

function columnsForBoard(){

 return [3,5,6].includes(state.count)?3:2;
}
function rotated(index){return (state.tableMode&&state.count>1&&index<columnsForBoard())!==state.players[index].rotated;}
function statusHTML(p){
 var badges=[];
 if(p.out)badges.push('<span class="status-badge">Fora da partida</span>');
 else M.warnings(p).forEach(function(w){badges.push('<span class="status-badge warn">'+esc(w)+'</span>');});
