function readForm(){
  if(!st)return;
  var g=function(id){return $(id);};
  if(g('srQ'))st.q=g('srQ').value;
  if(g('srType'))st.type=g('srType').value;
  if(g('srMv'))st.mv=g('srMv').value;
  if(g('srRole'))st.role=g('srRole').value;
  if(g('srOrder'))st.order=g('srOrder').value;
  if(g('srId'))st.identity=g('srId').checked;
  if(g('srOwned'))st.owned=g('srOwned').checked;
  if(g('srGC'))st.noGC=g('srGC').checked;
}
async function run(more){
  if(!st)return;readForm();
  var deck=S.get(st.deckId),mine=st;
  if(!more){mine.results=[];mine.next=null;mine.total=0;mine.approx=false;}
  mine.loading=true;mine.error='';mine.ran=true;D.refresh();
  try{
    var r;
    try{r=await S.scryfall.search(buildQuery(mine,deck,false),more?{next:mine.next}:{order:mine.order});}
    catch(e){
      if(e.status===400&&mine.role&&!more){r=await S.scryfall.search(buildQuery(mine,deck,true),{order:mine.order});mine.approx=true;}
      else throw e;
    }
    if(st!==mine)return;
    mine.results=mine.results.concat(r.cards);mine.total=r.total;mine.next=r.next;
  }catch(e){if(st===mine)mine.error=e.message;}
  if(st!==mine)return;
  mine.loading=false;D.refresh();
}
function findResult(name){
  if(st){var c=st.results.find(function(x){return x.name===name;});if(c)return c;}
  var hit=null;Object.keys(sug).some(function(k){var g=sug[k];return Object.keys(g.gap||{}).some(function(r){var cards=g.gap[r].cards||[];hit=cards.find(function(x){return x.name===name;});return !!hit;});});
  return hit;
}

/* ---------- Sugestões ---------- */
var sug={};/* por deck: {edh:{loading,data,error}, gap:{role:{loading,cards,error}}, more:{} } */
function sugFor(deck){return sug[deck.id]||(sug[deck.id]={edh:null,gap:{},more:{}});}
var EDH_ORDER=['High Synergy Cards','Top Cards','Game Changers','New Cards','Creatures','Instants','Sorceries','Utility Artifacts','Enchantments','Planeswalkers','Mana Artifacts','Utility Lands','Lands'];
var EDH_PT={'High Synergy Cards':'Alta sinergia','Top Cards':'As mais jogadas','Game Changers':'Game Changers','New Cards':'Novidades','Creatures':'Criaturas','Instants':'Instantâneas','Sorceries':'Feitiços','Utility Artifacts':'Artefatos','Enchantments':'Encantamentos','Planeswalkers':'Planeswalkers','Mana Artifacts':'Pedras de mana','Utility Lands':'Terrenos utilitários','Lands':'Terrenos','Battles':'Batalhas'};
function suggestPanel(deck){
  var g=sugFor(deck),s=C.stats(deck),names=inDeckNames(deck);
  if(!deck.commanders.length)return '<div class="panel empty-state"><h3>Escolha o comandante</h3><p>As sugestões dependem do comandante e da identidade de cor dele.</p><div class="toolbar"><button class="btn primary" data-dk="pick-commander">'+icon('crown')+'Escolher comandante</button></div></div>';
  var html='<section class="panel"><h3>Mais jogadas com '+esc(deck.commanders.map(function(c){return c.name.split(',')[0];}).join(' e '))+'</h3>';
  var e=g.edh;
  if(!e)html+='<p class="sub">O EDHREC reúne milhares de listas publicadas. Mostro as cartas que mais aparecem com esse comandante e que ainda não estão no deck.</p><button class="btn primary" data-sr="edh">'+icon('spark')+'Buscar no EDHREC</button>';
  else if(e.loading)html+=UI.loading('Consultando o EDHREC…');
  else if(e.error)html+='<p class="notice">'+esc(e.error)+'</p><button class="btn sm" data-sr="edh">Tentar de novo</button>';
  else{
    var lists=e.data.lists.slice().sort(function(a,b){var ia=EDH_ORDER.indexOf(a.header),ib=EDH_ORDER.indexOf(b.header);return (ia<0?99:ia)-(ib<0?99:ib);});
    html+='<p class="sub">'+(e.data.decks?nf(e.data.decks)+' decks no EDHREC. ':'')+'A porcentagem é a fração desses decks que joga a carta. <a href="'+esc(e.data.url)+'" target="_blank" rel="noopener noreferrer">Abrir no EDHREC</a></p>';
    lists.forEach(function(l){
      var cards=l.cards.filter(function(c){return !names[c.name];});
      if(!cards.length)return;
      var lim=g.more[l.header]?cards.length:8;
      html+='<div class="edh-list"><h4>'+esc(EDH_PT[l.header]||l.header)+'<span class="n">'+cards.length+'</span></h4><div class="sug-row">'+cards.slice(0,lim).map(function(c){
        return '<div class="sug"><button class="sug-img" data-sr="preview-name" data-name="'+esc(c.name)+'" aria-label="Ver '+esc(c.name)+'"><span class="cimg">'+UI.imgHTML(UI.namedImage(c.name),'',esc(c.name))+'</span></button><div class="sug-meta"><small>'+(c.pct!=null?UI.pct(c.pct,0)+' dos decks':'')+(c.synergy!=null&&c.synergy>0.05?', sinergia +'+Math.round(c.synergy*100):'')+'</small><button class="btn sm" data-sr="add-name" data-name="'+esc(c.name)+'" aria-label="Adicionar '+esc(c.name)+'">'+icon('plus')+'</button></div></div>';
      }).join('')+'</div>'+(cards.length>lim?'<button class="linkish" data-sr="edh-more" data-h="'+esc(l.header)+'">Ver todas as '+cards.length+'</button>':'')+'</div>';
    });
  }
  html+='</section>';
  /* Lacunas */
  var rows=['ramp','draw','removal','wipe'].map(function(k){return {key:k,have:s.roles[k],t:C.TARGETS[k]};}).concat(['counter','tutor','protection','recursion'].map(function(k){return {key:k,have:s.roles[k],t:null};}));
  html+='<section class="panel"><h3>Para cobrir funções</h3><p class="sub">Cartas populares no Commander, dentro da identidade de cor, para cada função. As funções abaixo da faixa usual vêm primeiro.</p>';
  rows.sort(function(a,b){var la=a.t&&a.have<a.t[0]?0:1,lb=b.t&&b.have<b.t[0]?0:1;return la-lb;});
  rows.forEach(function(r){
    var role=C.ROLES.find(function(x){return x.key===r.key;}),gp=g.gap[r.key],low=r.t&&r.have<r.t[0];
    html+='<div class="gap'+(low?' low':'')+'"><div class="gap-head"><b>'+role.label+'</b><span class="text-muted">'+r.have+(r.t?' de '+r.t[0]+' a '+r.t[1]:'')+'</span>'+(low?'<i class="rtag warnt">Abaixo</i>':'')+'<span class="grow"></span>'+
      (!gp?'<button class="btn sm" data-sr="gap" data-role="'+r.key+'">Ver sugestões</button>':'<button class="btn sm ghost" data-sr="gap-search" data-role="'+r.key+'">Buscar mais</button>')+'</div>';
    if(gp&&gp.loading)html+=UI.loading('Buscando…');
    else if(gp&&gp.error)html+='<p class="notice">'+esc(gp.error)+'</p>';
    else if(gp&&gp.cards){
      var cards=gp.cards.filter(function(c){return !names[c.name];}).slice(0,12);
      html+=cards.length?'<div class="sug-row">'+cards.map(function(c){
        return '<div class="sug"><button class="sug-img" data-sr="preview" data-name="'+esc(c.name)+'" aria-label="Ver '+esc(c.name)+'"><span class="cimg">'+UI.imgHTML(c.small||c.img,'',esc(c.name))+'</span></button><div class="sug-meta"><small>'+(c.usd!=null?money(c.usd):'')+(S.owned(c.name)?', tenho':'')+'</small><button class="btn sm" data-sr="add" data-name="'+esc(c.name)+'" aria-label="Adicionar '+esc(c.name)+'">'+icon('plus')+'</button></div></div>';}).join('')+'</div>':'<p class="hint">As mais populares dessa função já estão no deck.</p>';
    }
    html+='</div>';
  });
  return html+'</section>';
}
async function loadEdh(deck){
  var g=sugFor(deck);g.edh={loading:true};DeckUI.render();
  try{g.edh={data:await S.edhrec(deck.commanders)};}catch(e){g.edh={error:e.message};}
  DeckUI.render();
}
async function loadGap(deck,role){
  var g=sugFor(deck);g.gap[role]={loading:true};DeckUI.render();
  var base={q:'',type:'',mv:'',role:role,identity:true,noGC:false,commander:false};
  try{
    var r;
    try{r=await S.scryfall.search(buildQuery(base,deck,false),{order:'edhrec'});}
    catch(e){if(e.status===400)r=await S.scryfall.search(buildQuery(base,deck,true),{order:'edhrec'});else throw e;}
    g.gap[role]={cards:r.cards.slice(0,40)};
  }catch(e){g.gap[role]={error:e.message};}
  DeckUI.render();
}

/* ---------- Consulta rápida (mesa) ---------- */
function lookup(){
  D.open(function(){
    return {title:'Consultar carta',sub:'Regras e texto',body:'<div class="ac"><label class="sr-only" for="lkQ">Nome da carta</label><input id="lkQ" placeholder="Nome em inglês" autocomplete="off" spellcheck="false" autofocus><div class="ac-box" id="lkBox" hidden></div></div><p class="hint">Mostra o texto oficial atualizado (Oracle) e os esclarecimentos de regras, para resolver dúvida no meio do jogo.</p><div id="lkStatus"></div>',
      onOpen:function(){UI.attachAutocomplete($('lkQ'),$('lkBox'),function(name){
        $('lkStatus').innerHTML=UI.loading('Buscando…');
        S.scryfall.named(name).then(function(c){DeckUI.cardSheet({preview:c,from:'lookup',push:true});},function(e){$('lkStatus').innerHTML='<p class="notice">'+esc(e.message)+'</p>';});
      });}};
  },{tag:'lookup'});
}

/* ---------- Eventos ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-sr]');if(!el||el.disabled)return;
  var a=el.dataset.sr,deck=DeckUI.current();
  if(a==='run'){run(false);return;}
  if(a==='more'){run(true);return;}
  if(a==='preview'){var c=findResult(el.dataset.name);if(c)DeckUI.cardSheet({preview:c,from:'search',push:D.isOpen()});return;}
  if(a==='preview-name'){var nm=el.dataset.name;S.scryfall.named(nm).then(function(c){DeckUI.cardSheet({preview:c,from:'search',push:D.isOpen()});},function(err){toast(err.message);});return;}
  if(a==='add'){var c2=findResult(el.dataset.name);if(c2)DeckUI.addCard(c2,1,'main').then(function(){D.refresh();});return;}
  if(a==='add-name'){DeckUI.addCard(el.dataset.name,1,'main');return;}
  if(a==='pick-cmd'){var c3=findResult(el.dataset.name);if(c3)DeckUI.setCommander(c3);return;}
  if(!deck)return;
  if(a==='edh'){loadEdh(deck);return;}
  if(a==='edh-more'){sugFor(deck).more[el.dataset.h]=true;DeckUI.render();return;}
  if(a==='gap'){loadGap(deck,el.dataset.role);return;}
  if(a==='gap-search'){open(deck,{role:el.dataset.role});return;}
});
document.addEventListener('keydown',function(e){if(st&&e.key==='Enter'&&e.target.id==='srQ'){e.preventDefault();run(false);}});
document.addEventListener('change',function(e){if(st&&/^sr(Type|Mv|Role|Order|Id|Owned|GC)$/.test(e.target.id)){readForm();if(e.target.id==='srOwned'){D.refresh();return;}if(st.ran||e.target.id!=='srId')run(false);}});

window.Search={open:open,suggestPanel:suggestPanel,lookup:lookup,refresh:function(){if(st&&D.topIs('search'))D.refresh();},after:function(){},buildQuery:buildQuery,ROLEQ:ROLEQ};
})();
</script>
<script id="play">
(function(){
'use strict';
/* ============================================================
   Playtester (goldfish): mão inicial com London mulligan e um
   tabuleiro com campo, cemitério, exílio e zona de comando.
   ============================================================ */
var C=DeckCore,S=DeckStore,D=UI.dialog;
var esc=UI.esc,icon=UI.icon,nf=UI.nf,plural=UI.plural,toast=UI.toast,$=UI.$;
var games={},uidN=0;
var ZONES={hand:'Mão',bf:'Campo',gy:'Cemitério',ex:'Exílio',lib:'Grimório',cz:'Zona de comando'};

function inst(c,token){return {u:'k'+(++uidN),c:c,tapped:false,counters:0,token:!!token};}
function isLand(c){return C.analyze(c).land;}
function isPermanent(c){var a=C.analyze(c);return a.land||a.creature||a.artifact||a.enchant||a.pw||a.battle;}
function fresh(deck){
  var lib=[];deck.cards.forEach(function(e){for(var i=0;i<e.qty;i++)lib.push(inst(e.c));});
  C.shuffle(lib,Math.random);
  var g={deckId:deck.id,lib:lib,hand:lib.splice(0,7),bf:[],gy:[],ex:[],cz:deck.commanders.map(function(c){return {u:'k'+(++uidN),c:c,casts:0,tapped:false,counters:0};}),
    life:40,turn:0,mulls:0,bottom:0,sel:{},log:[],landPlayed:false,poison:0};
  games[deck.id]=g;return g;
}
function get(deck){var g=games[deck.id];if(!g||g.size!==deck.updated){g=fresh(deck);g.size=deck.updated;}return g;}
function log(g,t){g.log.unshift((g.turn?'T'+g.turn+': ':'')+t);if(g.log.length>40)g.log.length=40;}
function mulligan(deck){var g=games[deck.id],m=g?g.mulls+1:1;g=fresh(deck);g.size=deck.updated;g.mulls=m;g.bottom=Math.max(0,m-1);}
function zone(g,z){return g[z];}
function find(g,u){var zs=['hand','bf','gy','ex','lib','cz'];for(var i=0;i<zs.length;i++){var arr=g[zs[i]],k=arr.findIndex(function(x){return x.u===u;});if(k>=0)return {zone:zs[i],i:k,card:arr[k]};}return null;}
function move(g,u,to,pos){
  var f=find(g,u);if(!f)return;
  if(f.zone==='cz'){/* conjurar o comandante */
    var cm=f.card;cm.casts++;g.cz.splice(f.i,1);var b=inst(cm.c);b.cmd=cm;g.bf.push(b);log(g,'Conjurou '+cm.c.name+(cm.casts>1?' (taxa +'+2*(cm.casts-1)+')':''));return;
  }
  var card=g[f.zone].splice(f.i,1)[0];
  if(card.cmd&&(to==='gy'||to==='ex'||to==='hand'||to==='lib'||to==='cz')&&to!=='bf'){
    /* comandante volta para a zona de comando (substituição usual) */
    g.cz.push(card.cmd);log(g,card.c.name+' voltou para a zona de comando');return;
  }
  if(card.token&&to!=='bf'){log(g,'Ficha '+card.c.name+' deixou de existir');return;}
  card.tapped=false;if(to!=='bf')card.counters=0;
  if(to==='lib'){if(pos==='bottom')g.lib.push(card);else g.lib.unshift(card);}
  else g[to].push(card);
  if(to==='bf'&&f.zone==='hand'&&isLand(card.c))g.landPlayed=true;
  log(g,card.c.name+': '+ZONES[f.zone]+' → '+ZONES[to]+(to==='lib'?(pos==='bottom'?' (fundo)':' (topo)'):''));
}
function draw(g,n){for(var i=0;i<(n||1);i++){if(!g.lib.length){toast('O grimório acabou.');return;}var c=g.lib.shift();c.fresh=true;g.hand.push(c);}}
function manaAvailable(g){
  var n=0;g.bf.forEach(function(x){if(x.tapped)return;var a=C.analyze(x.c);if(a.land||a.source&&a.rampKind!=='burst'&&a.rampKind!=='land')n+=a.land?1:(a.amount||1);});return n;
}
function tile(x,zone,opts){
  opts=opts||{};
  var c=x.c;
  return '<button class="pt-card'+(x.tapped?' tapped':'')+(x.fresh?' fresh':'')+(opts.sel?' sel':'')+'" data-pt="'+(opts.action||'menu')+'" data-u="'+x.u+'" data-z="'+zone+'" aria-label="'+esc(c.name)+(x.tapped?', virada':'')+'">'+
   '<span class="cimg">'+UI.imgHTML(c.small||c.img,'',esc(c.name))+'</span>'+(x.counters?'<span class="ctr">'+(x.counters>0?'+':'')+x.counters+'</span>':'')+(x.token?'<span class="tok-b">Ficha</span>':'')+'</button>';
}
function panel(deck){
  var n=deck.cards.reduce(function(a,e){return a+e.qty;},0);
  if(n<8)return '<div class="panel empty-state"><h3>Poucas cartas</h3><p>Adicione cartas ao deck para testar.</p></div>';
  var g=get(deck);
  if(g.turn===0)return openingHand(deck,g);
  var lands=g.bf.filter(function(x){return isLand(x.c);}),perms=g.bf.filter(function(x){return !isLand(x.c);});
  var html='<section class="panel pt">'+
   '<div class="pt-bar"><div class="pt-stat"><span>Turno</span><b>'+g.turn+'</b></div>'+
   '<div class="pt-stat life"><span>Vida</span><div class="pt-life"><button data-pt="life" data-d="-1" aria-label="Perder 1 de vida">−</button><b>'+g.life+'</b><button data-pt="life" data-d="1" aria-label="Ganhar 1 de vida">+</button></div></div>'+
   '<div class="pt-stat"><span>Mana disponível</span><b>'+manaAvailable(g)+'</b></div>'+
   '<div class="pt-stat"><span>Grimório</span><b>'+g.lib.length+'</b></div>'+
   '<span class="grow"></span><button class="btn primary" data-pt="next">'+icon('chevR')+'Próximo turno</button></div>'+
   '<div class="toolbar pt-tools"><button class="btn sm" data-pt="draw">'+icon('plus')+'Comprar</button><button class="btn sm" data-pt="untap">'+icon('tap')+'Desvirar tudo</button><button class="btn sm" data-pt="search">'+icon('search')+'Buscar no grimório</button><button class="btn sm" data-pt="top">'+icon('eye')+'Ver o topo</button><button class="btn sm" data-pt="shuffle">'+icon('shuffle')+'Embaralhar</button><button class="btn sm" data-pt="tokens">'+icon('layers')+'Criar ficha</button><button class="btn sm ghost" data-pt="restart">'+icon('refresh')+'Recomeçar</button></div>'+
   (!g.landPlayed&&g.hand.some(function(x){return isLand(x.c);})?'<p class="hint pt-hint">Você ainda não jogou terreno neste turno.</p>':'')+

/* Recorta uma região e prepara para o OCR: cinza, contraste e, se preciso, inverte para fundo claro.

function prepare(source,sx,sy,sw,sh,mode,maxW){

  var deck=DeckUI.current();
  var body='<div class="seg scan-dest" role="group" aria-label="Para onde vai a carta">'+
    (deck?'<button data-sc="dest" data-d="main" aria-pressed="'+(st.dest==='main')+'">Deck</button><button data-sc="dest" data-d="maybe" aria-pressed="'+(st.dest==='maybe')+'">Considerando</button>':'')+
    '<button data-sc="dest" data-d="collection" aria-pressed="'+(st.dest==='collection')+'">Coleção</button></div>'+
    '<div class="scan-box" id="scanBox"><div class="scan-guide" id="scanGuide"><span class="band"></span></div><div class="scan-msg" id="scanMsg">'+esc(st.status)+'</div></div>'+
    '<div class="scan-result" id="scanResult">'+resultHTML()+'</div>'+
    '<div class="toolbar scan-tools"><label class="check"><input type="checkbox" id="scanAuto"'+(st.auto?' checked':'')+'>Adicionar sozinho ao reconhecer</label><span class="grow"></span><label class="btn sm" for="scanPhoto">'+icon('camera')+'Usar uma foto</label><input type="file" id="scanPhoto" accept="image/*" capture="environment" class="import-input"></div>'+
    '<p class="hint">Encaixe a carta na moldura com o nome na faixa de cima, com boa luz e sem reflexo. No modo automático, a mesma carta só entra de novo depois que você a tira da frente da câmera. Funciona com o nome em inglês; cartas em outra língua podem não ser encontradas.</p>'+
    (st.recent.length?'<p class="section-label">Escaneadas agora</p><ul class="scan-recent">'+st.recent.map(function(r,i){return '<li><span class="q">'+r.qty+'</span><span class="nm">'+esc(r.c.name)+'</span><small>'+esc(destLabel(r.dest))+'</small><button class="btn sm" data-sc="plus" data-i="'+i+'" aria-label="Mais uma">+1</button><button class="btn sm ghost" data-sc="undo" data-i="'+i+'" aria-label="Desfazer">'+icon('undo')+'</button></li>';}).join('')+'</ul>':'');
  return {title:'Escanear cartas',sub:st.dest==='collection'?'Para a coleção':'Para '+(deck?deck.name:''),body:body,wide:true,
    onOpen:function(){var box=$('scanBox'),v=st.video;if(box&&v){box.insertBefore(v,box.firstChild);if(st.stream&&v.srcObject!==st.stream)v.srcObject=st.stream;if(v.paused&&st.stream)v.play().catch(function(){});}
      var a=$('scanAuto');if(a)a.addEventListener('change',function(){st.auto=a.checked;});
      var ph=$('scanPhoto');if(ph)ph.addEventListener('change',onPhoto);}};
}
function destLabel(d){return d==='collection'?'Coleção':d==='maybe'?'Considerando':'Deck';}
function resultHTML(){
  if(!st.found)return st.cand?'<p class="hint">Lido: “'+esc(st.cand)+'”. Procurando…</p>':'';
  var c=st.found;
  return '<div class="scan-card"><div class="card-img xs">'+UI.imgHTML(c.small||c.img,'',esc(c.name))+'</div><div class="nm"><b>'+esc(c.name)+'</b><small>'+esc(c.type_line)+'</small>'+(c.usd!=null?'<small>'+UI.money(c.usd)+'</small>':'')+'</div><button class="btn primary" data-sc="add">'+icon('plus')+'Adicionar</button></div>';
}
function paintStatus(){var m=$('scanMsg');if(m)m.textContent=st.loadPct&&st.loadPct<100&&!worker?'Carregando o leitor de texto: '+st.loadPct+'%':st.status;}
function paintResult(){var r=$('scanResult');if(r)r.innerHTML=resultHTML();}
async function start(){
  getWorker().then(function(){if(st){st.status=st.stream?'Aponte para o nome da carta':st.status;paintStatus();}},function(e){if(st){st.status=e.message;paintStatus();}});
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){st.status='Este navegador não libera a câmera aqui. Use "Usar uma foto" ou abra pelo link https do app.';paintStatus();return;}
  try{
    var stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    if(!st){stream.getTracks().forEach(function(t){t.stop();});return;}
    st.stream=stream;var v=st.video;v.srcObject=stream;await v.play().catch(function(){});
    st.status=worker?'Aponte para o nome da carta':'Carregando o leitor de texto…';paintStatus();
    loop();
  }catch(e){
    st.status=e&&e.name==='NotAllowedError'?'A câmera foi bloqueada. Libere nas permissões do navegador ou use "Usar uma foto".':'Não deu para abrir a câmera aqui. Use "Usar uma foto" ou abra pelo link https do app.';
    paintStatus();
  }
}
function stop(){
  if(!st)return;clearTimeout(st.timer);
  if(st.stream)st.stream.getTracks().forEach(function(t){t.stop();});
  var had=st.recent.length;st=null;
  if(had)DeckUI.render();
}
function loop(){
  if(!st)return;
  st.timer=setTimeout(async function(){
    if(!st)return;
    var v=st.video,box=$('scanBox');
    if(worker&&!st.busy&&v&&box&&v.readyState>=2&&!document.hidden){
      st.busy=true;st.tick=(st.tick||0)+1;
      try{
        var lines=null;
        if(st.tick%2){var crop=videoCrop(v,box,BAND);if(crop)lines=await readLines(prepare(v,crop.sx,crop.sy,crop.sw,crop.sh,'auto').canvas,'7');}
        else{var top=videoCrop(v,box,{x0:0,x1:1,y0:0,y1:0.24});if(top)lines=await readLines(prepare(v,top.sx,top.sy,top.sw,top.sh,st.tick%4?'keep':'invert',900).canvas,'6');}
        if(lines)await processLines(lines,false);
      }catch(e){if(st){st.status=e.message;paintStatus();}}
      if(st)st.busy=false;
    }
    loop();
  },650);
}
function variants(cand){
  var out=[cand],words=cand.split(' ');
  for(var k=1;k<=2&&words.length-k>=1;k++){var v=words.slice(0,words.length-k).join(' ').replace(/[\s,.'-]+$/,'');if(v.length>=4)out.push(v);}
  return out;
}
async function processLines(lines,single){
  if(!st)return false;
  var usable=lines.filter(function(l){return l.conf>=40&&C.ocrCandidates(l.text).length;}).slice(0,single?5:2);
  if(!usable.length){
    if(!single){st.emptyTicks=(st.emptyTicks||0)+1;if(st.emptyTicks>=3)st.lastAdded="";st.status=st.lastAdded?'Tire a carta e mostre a próxima':'Aponte para o nome da carta';paintStatus();}
    return false;
  }
  st.emptyTicks=0;
  for(var i=0;i<usable.length;i++){
    var line=usable[i],cand=C.ocrCandidates(line.text)[0],key=cand.toLowerCase();
    if(!single&&i===0&&line.conf<80){st.stable[key]=(st.stable[key]||0)+1;if(st.stable[key]<2){st.cand=cand;paintResult();return false;}}
    if(st.found&&st.found.name.toLowerCase().indexOf(key)===0)return true;
    st.cand=cand;paintResult();
    var vs=variants(cand),c=null;
    for(var k=0;k<vs.length&&!c;k++)c=await resolve(vs[k]);
    if(!st)return false;
    if(c){
      st.stable={};st.found=c;st.cand='';st.status='Reconhecida';paintStatus();paintResult();
      if(st.lastAdded&&st.lastAdded!==c.name)st.lastAdded='';
      if(st.auto&&st.lastAdded!==c.name)add(c);
      else if(st.auto){st.status='Já adicionada. Mostre a próxima carta, ou toque em Adicionar para outra cópia.';paintStatus();}
      return true;
    }
  }
  st.status='Não achei “'+(st.cand||'')+'”. Ajuste a carta na moldura.';st.cand='';paintStatus();paintResult();
  return false;
}
async function onPhoto(e){
  var f=e.target.files&&e.target.files[0];e.target.value='';if(!f||!st)return;
  st.status='Lendo a foto…';paintStatus();st.busy=true;
  try{
    var bmp=await createImageBitmap(f),w=bmp.width,h=bmp.height,ok=false;
    /* Foto inteira com leitura automática de layout; depois a metade de cima, depois invertida */
    var tries=[[0,0,1,1,'keep','3'],[0,0,1,0.5,'keep','3'],[0,0,1,0.5,'invert','3']];
    for(var i=0;i<tries.length&&!ok&&st;i++){
      var t=tries[i],cv=prepare(bmp,w*t[0],h*t[1],w*t[2],h*t[3],t[4],1400).canvas;
      ok=await processLines(await readLines(cv,t[5]),true);
    }
    if(st&&!ok){st.status='Não reconheci o nome nessa foto. Tente mais perto, com a carta reta e boa luz.';paintStatus();}
  }catch(err){if(st){st.status=err.message||'Não deu para ler a foto.';paintStatus();}}
  if(st)st.busy=false;
}
function add(c){
  if(!st)return;
  var dest=st.dest,deck=DeckUI.current();
  if(dest==='collection')S.setOwned(c.name,S.owned(c.name)+1);
  else if(deck){
    if(C.canBeCommander(c)&&!deck.commanders.length&&dest==='main'){
      S.mutate(deck.id,'Comandante '+c.name,function(d){d.commanders.push(c);if(/^(Novo deck|Deck sem nome)$/.test(d.name))d.name=c.name.split(',')[0];});
      toast(c.name+' virou o comandante.');
    }else DeckUI.addCard(c,1,dest,true);
  }
  var hit=st.recent.find(function(r){return r.c.name===c.name&&r.dest===dest;});
  if(hit)hit.qty++;else st.recent.unshift({c:c,dest:dest,qty:1});
  st.lastAdded=c.name;st.lastAddedAt=Date.now();st.found=null;st.status='Adicionada: '+c.name+'. Próxima carta.';
  if(navigator.vibrate)try{navigator.vibrate(30);}catch(_){}
  D.refresh();
}
function undoRecent(i,plus){
  var r=st.recent[i];if(!r)return;var deck=DeckUI.current();
  var delta=plus?1:-1;
  if(r.dest==='collection')S.setOwned(r.c.name,S.owned(r.c.name)+delta);
  else if(deck){
    if(plus)DeckUI.addCard(r.c,1,r.dest,true);
    else S.mutate(deck.id,'Desfazer escaneada',function(d){var list=r.dest==='maybe'?d.maybe:d.cards,x=list.find(function(y){return y.c.name===r.c.name;});if(!x)return;x.qty--;if(x.qty<=0){if(r.dest==='maybe')d.maybe=d.maybe.filter(function(y){return y!==x;});else d.cards=d.cards.filter(function(y){return y!==x;});}});
  }
  r.qty+=delta;if(r.qty<=0)st.recent.splice(i,1);
  D.refresh();
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-sc]');if(!el||!st)return;
  var a=el.dataset.sc;
  if(a==='dest'){st.dest=el.dataset.d;D.refresh();return;}
  if(a==='add'&&st.found){add(st.found);return;}
  if(a==='plus'){undoRecent(Number(el.dataset.i),true);return;}
  if(a==='undo'){undoRecent(Number(el.dataset.i),false);return;}
});
window.Scan={open:open,_prepare:prepare,_read:readLines,BAND:BAND};
})();
</script>
<script id="proxies">
(function(){
'use strict';
/* ============================================================
   Proxies: folha A4 com 9 cartas em 63 × 88 mm, pronta para imprimir.
   ============================================================ */
var C=DeckCore,S=DeckStore,D=UI.dialog;
var esc=UI.esc,icon=UI.icon,nf=UI.nf,plural=UI.plural,toast=UI.toast,$=UI.$;
var opt={which:'all',basics:false,backs:true};

function large(url){return String(url||'').replace('/normal/','/large/').replace('/small/','/large/');}
function list(deck){
  var out=[];
  function push(c,qty){
    var a=C.analyze(c);
    if(a.basic&&!opt.basics)return;
    for(var i=0;i<qty;i++){out.push({name:c.name,img:large(c.img||c.small)});if(opt.backs&&c.back)out.push({name:c.name+' (verso)',img:large(c.back)});}
  }
  if(opt.which==='maybe'){deck.maybe.forEach(function(e){push(e.c,e.qty);});return out;}
  deck.commanders.forEach(function(c){var q=opt.which==='missing'?DeckUI.missingQty(c,1):1;if(q)push(c,q);});
  deck.cards.forEach(function(e){var q=opt.which==='missing'?DeckUI.missingQty(e.c,e.qty):e.qty;if(q)push(e.c,q);});
  return out;
}
function open(deck){
  D.open(function(){
    var items=list(deck),pages=Math.ceil(items.length/9),coll=DeckUI.useCollection();
    return {title:'Imprimir proxies',sub:deck.name,body:
      '<div class="field"><span class="label">Quais cartas</span>'+
      '<label class="check"><input type="radio" name="pxWhich" value="all"'+(opt.which==='all'?' checked':'')+'>O deck inteiro, com o comandante</label>'+
      (coll?'<label class="check"><input type="radio" name="pxWhich" value="missing"'+(opt.which==='missing'?' checked':'')+'>Só o que falta na minha coleção</label>':'')+
      (deck.maybe.length?'<label class="check"><input type="radio" name="pxWhich" value="maybe"'+(opt.which==='maybe'?' checked':'')+'>As cartas em Considerando</label>':'')+'</div>'+
      '<label class="toggle-label"><span>Terrenos básicos<small>Normalmente você já tem.</small></span><input type="checkbox" id="pxBasics"'+(opt.basics?' checked':'')+'></label>'+
      '<label class="toggle-label"><span>Verso das cartas dupla-face<small>Sai como uma carta a mais, para colar no verso ou usar como marcador.</small></span><input type="checkbox" id="pxBacks"'+(opt.backs?' checked':'')+'></label>'+
      '<div class="info-box">'+items.length+' '+plural(items.length,'carta','cartas')+' em '+pages+' '+plural(pages,'folha','folhas')+' A4. Imprima em escala 100% (sem "ajustar à página") para sair em 63 × 88 mm, o tamanho de uma carta.</div>'+
      '<p class="hint">Proxies servem para testar o deck em mesa casual, com a concordância de todos. Não use em torneio.</p>',
      footer:'<button class="btn ghost" data-ui="close">Cancelar</button><button class="btn primary" data-px="print"'+(items.length?'':' disabled')+'>'+icon('print')+'Imprimir</button>',
      onOpen:function(dlg){
        dlg.querySelectorAll('input[name=pxWhich]').forEach(function(r){r.addEventListener('change',function(){opt.which=r.value;D.refresh();});});
        $('pxBasics').addEventListener('change',function(e){opt.basics=e.target.checked;D.refresh();});
        $('pxBacks').addEventListener('change',function(e){opt.backs=e.target.checked;D.refresh();});
      }};
  },{tag:'proxies'});
  open.deck=deck;
}
async function print(){
  var deck=open.deck,items=list(deck);if(!items.length)return;
  var area=$('printArea');
  area.innerHTML='';
  for(var p=0;p<items.length;p+=9){
    var page=document.createElement('div');page.className='pp';
    items.slice(p,p+9).forEach(function(it){
      var cell=document.createElement('div');cell.className='pc';
      if(it.img){var im=document.createElement('img');im.src=it.img;im.alt=it.name;cell.appendChild(im);}
      else{cell.textContent=it.name;cell.classList.add('noimg');}
      page.appendChild(cell);
    });
    area.appendChild(page);
  }
  var btn=UI.dialog.el.querySelector('[data-px="print"]');if(btn){btn.disabled=true;btn.textContent='Carregando imagens…';}
  var imgs=[].slice.call(area.querySelectorAll('img'));
  await Promise.race([Promise.all(imgs.map(function(im){return im.complete?Promise.resolve():new Promise(function(r){im.onload=im.onerror=r;});})),new Promise(function(r){setTimeout(r,20000);})]);
  var failed=imgs.filter(function(im){return !im.naturalWidth;}).length;
  D.close();
  document.body.classList.add('printing');
  setTimeout(function(){
    try{window.print();}catch(e){toast('O navegador bloqueou a impressão aqui. Abra o app pelo link https.');}
    setTimeout(function(){document.body.classList.remove('printing');area.innerHTML='';},500);
    if(failed)toast(failed+' '+plural(failed,'imagem não carregou','imagens não carregaram')+'; confira a conexão.');
  },100);
}
document.addEventListener('click',function(e){var el=e.target.closest('[data-px]');if(!el||el.disabled)return;if(el.dataset.px==='print')print();});
window.addEventListener('afterprint',function(){document.body.classList.remove('printing');});
window.Proxies={open:open,_list:list,_opt:opt};
})();
</script>
<script id="games">
(function(){
'use strict';
/* ============================================================
   Aba Partidas: registro de resultados, estatísticas por deck e
   por jogador, backup único de tudo.
   ============================================================ */
var C=DeckCore,S=DeckStore,D=UI.dialog;
var esc=UI.esc,icon=UI.icon,nf=UI.nf,pct=UI.pct,plural=UI.plural,toast=UI.toast,$=UI.$;
var root=$('gamesView');

function render(){
  if(root.hidden)return;
  var games=S.games(),st=C.gameStats(games),size=S.collectionSize();
  var html='<div class="gm">';
  html+='<header class="panel gm-head"><div><h1 class="gm-title">Partidas</h1><p class="sub">'+(games.length?nf(games.length)+' '+plural(games.length,'partida registrada','partidas registradas')+(st.avgDuration?', duração média de '+UI.fmtDuration(st.avgDuration):'')+'.':'Nenhuma partida registrada ainda.')+'</p></div>'+
   '<div class="toolbar"><button class="btn primary" data-gm="finish">'+icon('flag')+'Registrar a partida da mesa</button></div></header>';
  if(!games.length){
    html+='<div class="panel empty-state"><h3>Seu histórico começa na mesa</h3><p>Quando sobrar um jogador, a mesa oferece registrar a vitória. Também dá para encerrar a qualquer momento pelo histórico da mesa ou pelo botão acima. Com algumas partidas, aparecem aqui as vitórias por deck e por jogador.</p></div>';
  }else{
    html+='<div class="grid2">';
    html+='<section class="panel"><h3>Decks</h3><p class="sub">Vitórias de cada deck nas partidas registradas. Jogador sem deck nem comandante não entra aqui.</p>'+(st.decks.length?'':'<p class="empty">Ligue um deck ao painel de cada jogador para ver as vitórias por deck.</p>')+(st.decks.length?'<div class="scroll-x"><table class="ttable gm-table"><thead><tr><th>Deck</th><th>Partidas</th><th>Vitórias</th><th>Taxa</th></tr></thead><tbody>'+
      st.decks.map(function(d){var deck=d.deckId?S.get(d.deckId):null,art=deck&&deck.commanders[0]&&deck.commanders[0].art;
        return '<tr><td><span class="gm-deck">'+(art?'<span class="thumb" style="background-image:url(\''+esc(art)+'\')"></span>':'<span class="thumb">'+icon('deck')+'</span>')+'<span><b>'+esc(deck?deck.name:d.name)+'</b>'+(d.commander&&d.commander!==d.name?'<small>'+esc(d.commander)+'</small>':'')+'</span></span></td><td>'+d.games+'</td><td>'+d.wins+'</td><td>'+bar(d.wins/d.games)+'</td></tr>';}).join('')+'</tbody></table></div>':'')+'</section>';
    html+='<section class="panel"><h3>Jogadores</h3><p class="sub">Pelo nome usado na mesa.</p><div class="scroll-x"><table class="ttable gm-table"><thead><tr><th>Jogador</th><th>Partidas</th><th>Vitórias</th><th>Taxa</th></tr></thead><tbody>'+
      st.players.map(function(p){return '<tr><td><b>'+esc(p.name)+'</b></td><td>'+p.games+'</td><td>'+p.wins+'</td><td>'+bar(p.wins/p.games)+'</td></tr>';}).join('')+'</tbody></table></div></section>';
    html+='</div>';
    html+='<section class="panel"><h3>Histórico</h3><ul class="gm-list">'+games.slice(0,200).map(function(g){
      return '<li><div class="gm-when"><b>'+UI.fmtDate(g.at,true)+'</b><small>'+(g.durationMs?UI.fmtDuration(g.durationMs)+', ':'')+g.rounds+' '+plural(g.rounds,'rodada','rodadas')+'</small></div>'+
        '<div class="gm-players">'+g.players.map(function(p,i){var w=g.winner===i;return '<span class="gm-p'+(w?' win':'')+'" style="--pc:'+esc(p.color)+'">'+(w?icon('crown'):'')+'<b>'+esc(p.name)+'</b>'+(p.deckName||p.commander?'<small>'+esc(p.deckName||p.commander)+'</small>':'')+'</span>';}).join('')+
        (g.winner===null?'<span class="gm-p draw">Sem vencedor</span>':'')+(g.note?'<p class="gm-note">'+esc(g.note)+'</p>':'')+'</div>'+
        '<button class="icon-btn" data-gm="edit" data-id="'+esc(g.id)+'" aria-label="Editar partida">'+icon('edit')+'</button></li>';}).join('')+'</ul>'+(games.length>200?'<p class="hint">Mostrando as 200 mais recentes.</p>':'')+'</section>';
  }
  html+='<section class="panel"><h3>Backup</h3><p class="sub">Um arquivo com todos os decks, a coleção ('+nf(size.total)+' '+plural(size.total,'carta','cartas')+'), o histórico de partidas e a mesa atual. Use para trocar de aparelho ou guardar uma cópia; tudo fica só neste navegador.</p>'+
   '<div class="toolbar"><button class="btn" data-gm="backup">'+icon('down')+'Baixar backup</button><button class="btn" data-gm="restore">'+icon('up')+'Restaurar backup</button></div></section>';
  html+='</div>';
  root.innerHTML=html;
}
function bar(p){return '<span class="mini-bar"><i style="width:'+Math.round(100*p)+'%"></i></span><span class="mini-v">'+pct(p,0)+'</span>';}

/* ---------- Registrar resultado ---------- */
function finish(){
  if(!window.CommanderTable){toast('A mesa não está disponível.');return;}
  var sum=CommanderTable.summary(),alive=sum.players.map(function(p,i){return p.out?-1:i;}).filter(function(i){return i>=0;});
  var st={winner:alive.length===1?alive[0]:null,note:'',saved:null};
  if(sum.recorded&&S.games().some(function(g){return g.id===sum.recorded;}))st.already=true;
  D.open(function(){
    if(st.saved)return {title:'Partida registrada',sub:'Partidas',body:'<p class="text-muted">'+(st.winner!==null?esc(sum.players[st.winner].name)+' venceu.':'Registrada sem vencedor.')+' O resultado está na aba Partidas.</p>',
      footer:'<button class="btn ghost" data-gm="go">Ver partidas</button><button class="btn primary" data-gm="new-game">'+icon('refresh')+'Nova partida</button>'};
    return {title:'Encerrar partida',sub:'Rodada '+sum.rounds+(sum.durationMs?', '+UI.fmtDuration(sum.durationMs):''),body:
      (st.already?'<p class="notice">Esta partida já foi registrada. Registrar de novo cria outra entrada.</p>':'')+
      '<p class="section-label">Quem venceu?</p><div class="menu gm-pick">'+sum.players.map(function(p,i){
        return '<button data-gm="winner" data-i="'+i+'" aria-pressed="'+(st.winner===i)+'"><span class="avatar" style="--pc:'+esc(p.color)+';width:34px;height:34px">'+(i+1)+'</span><span>'+esc(p.name)+'<small>'+esc([p.deckName||p.commander,p.out?'fora':'',p.life+' de vida'].filter(Boolean).join(', '))+'</small></span>'+(st.winner===i?icon('crown'):'')+'</button>';}).join('')+
      '<button data-gm="winner" data-i="-1" aria-pressed="'+(st.winner===null)+'">'+icon('minus')+'<span>Sem vencedor<small>Empate ou partida interrompida.</small></span></button></div>'+
      '<div class="field"><label for="gmNote">Observação (opcional)</label><input id="gmNote" maxlength="200" placeholder="Ex.: venceu com Thassa\'s Oracle no turno 6" value="'+esc(st.note)+'"></div>'+
      '<p class="hint">Os decks que estavam ligados aos painéis contam nas estatísticas. Jogador sem deck entra com o nome do comandante.</p>',
      footer:'<button class="btn ghost" data-ui="close">Cancelar</button><button class="btn primary" data-gm="save">'+icon('check')+'Registrar partida</button>'};
  },{tag:'finish'});
  finish.st=st;finish.sum=sum;
}
function editGame(id){
  var g=S.games().find(function(x){return x.id===id;});if(!g)return;
  var st={winner:g.winner,note:g.note};
  D.open(function(){
    return {title:'Editar partida',sub:UI.fmtDate(g.at,true),body:'<p class="section-label">Vencedor</p><div class="menu gm-pick">'+g.players.map(function(p,i){
        return '<button data-gm="e-winner" data-i="'+i+'" aria-pressed="'+(st.winner===i)+'"><span class="avatar" style="--pc:'+esc(p.color)+';width:34px;height:34px">'+(i+1)+'</span><span>'+esc(p.name)+'<small>'+esc(p.deckName||p.commander)+'</small></span>'+(st.winner===i?icon('crown'):'')+'</button>';}).join('')+
      '<button data-gm="e-winner" data-i="-1" aria-pressed="'+(st.winner===null)+'">'+icon('minus')+'<span>Sem vencedor</span></button></div>'+
      '<div class="field"><label for="gmNote">Observação</label><input id="gmNote" maxlength="200" value="'+esc(st.note)+'"></div>',
      footer:'<button class="btn danger" data-gm="delete" data-id="'+esc(id)+'">'+icon('trash')+'Excluir</button><button class="btn primary" data-gm="e-save" data-id="'+esc(id)+'">Salvar</button>'};
  },{tag:'edit-game'});
  editGame.st=st;
}

/* ---------- Backup ---------- */
function backup(){
  var table=window.CommanderTable?CommanderTable.exportState():null;
  UI.download('commander-backup-'+new Date().toISOString().slice(0,10)+'.json',S.exportAll(table),'application/json');
  toast('Backup baixado.');
}
function restore(raw){
  var decks=Array.isArray(raw.decks)?raw.decks.length:0,games=Array.isArray(raw.games)?raw.games.length:0,coll=raw.collection?Object.keys(raw.collection).length:0;
  restore.raw=raw;
  UI.dialog.simple('Restaurar backup','Partidas','<p class="text-muted">O arquivo tem '+decks+' '+plural(decks,'deck','decks')+', '+games+' '+plural(games,'partida','partidas')+' e '+nf(coll)+' '+plural(coll,'carta','cartas diferentes')+' na coleção. Decks e partidas que já existem aqui não são duplicados; a coleção é somada.</p>'+
    (raw.table?'<label class="toggle-label"><span>Restaurar também a mesa<small>Substitui a partida em andamento. Dá para desfazer na mesa.</small></span><input type="checkbox" id="rsTable"></label>':''),
    '<button class="btn ghost" data-ui="close">Cancelar</button><button class="btn primary" data-gm="do-restore">Restaurar</button>');
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-gm]');if(!el||el.disabled)return;
  var a=el.dataset.gm;
  if(a==='finish'){finish();return;}
  if(a==='winner'){var i=Number(el.dataset.i);finish.st.winner=i<0?null:i;var n=$('gmNote');if(n)finish.st.note=n.value;D.refresh();return;}
  if(a==='save'){
    var st=finish.st,sum=finish.sum,note=$('gmNote')?$('gmNote').value.trim():'';
    var g=S.addGame({at:Date.now(),durationMs:sum.durationMs,rounds:sum.rounds,players:sum.players,winner:st.winner,note:note});
    if(g&&window.CommanderTable)CommanderTable.markRecorded(g.id);
    st.saved=g;D.refresh();render();return;
  }
  if(a==='new-game'){D.close();if(window.App)App.setView('table');if(window.CommanderTable)CommanderTable.newGame();return;}
  if(a==='go'){D.close();if(window.App)App.setView('games');return;}
  if(a==='edit'){editGame(el.dataset.id);return;}
  if(a==='e-winner'){var j=Number(el.dataset.i);editGame.st.winner=j<0?null:j;var n2=$('gmNote');if(n2)editGame.st.note=n2.value;D.refresh();return;}
  if(a==='e-save'){S.updateGame(el.dataset.id,{winner:editGame.st.winner,note:$('gmNote').value.trim()});D.close();toast('Partida atualizada.');return;}
  if(a==='delete'){if(confirm('Excluir esta partida do histórico?')){S.removeGame(el.dataset.id);D.close();toast('Partida excluída.');}return;}
  if(a==='backup'){backup();return;}
  if(a==='restore'){$('deckFileInput').click();return;}
  if(a==='do-restore'){
    var raw=restore.raw,withTable=$('rsTable')&&$('rsTable').checked;
    try{
      var r=S.importLibrary(raw);
      if(withTable&&raw.table&&window.CommanderTable)CommanderTable.restoreState(raw.table);
      D.close();toast(r.decks+' '+plural(r.decks,'deck','decks')+' e '+r.games+' '+plural(r.games,'partida','partidas')+' restaurados.');render();
    }catch(err){toast('Arquivo inválido.');}
    return;
  }
});
S.subscribe(function(kind){if(kind==='games'||kind==='list'||kind==='collection')render();});
window.Games={render:render,finish:finish,restore:restore,backup:backup};
})();
</script>
<script id="app">
(function(){
'use strict';
/* Navegação entre Mesa, Deck e Partidas, e início do app. */
var VIEW_KEY='commander-suite-view',VIEWS={table:'tableView',deck:'deckView',games:'gamesView'};
function setView(v,skipSave){
  if(!VIEWS[v])v='table';
  document.body.dataset.view=v;
  Object.keys(VIEWS).forEach(function(k){document.getElementById(VIEWS[k]).hidden=k!==v;});
  document.querySelectorAll('[data-view-btn]').forEach(function(b){b.setAttribute('aria-selected',String(b.dataset.viewBtn===v));});
  if(!skipSave)try{localStorage.setItem(VIEW_KEY,v);}catch(e){}
  if(v==='deck')DeckUI.render();else if(v==='games')Games.render();else if(window.CommanderTable)CommanderTable.refresh();
  try{if(history.replaceState&&/^https?:$/.test(location.protocol))history.replaceState(null,'',v==='table'?location.pathname+location.search:'#'+v);}catch(e){}
}
document.querySelectorAll('[data-view-btn]').forEach(function(b){b.addEventListener('click',function(){setView(b.dataset.viewBtn);window.scrollTo(0,0);});});
window.App={setView:setView};
DeckStore.load();
var start='table';try{start=localStorage.getItem(VIEW_KEY)||'table';}catch(e){}
if(/^#(deck|games)$/.test(location.hash))start=location.hash.slice(1);
setView(start,true);
if('serviceWorker' in navigator&&(location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname))&&!/srcdoc/.test(location.href)&&/(\/|index\.html)$/.test(location.pathname)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
var s=DeckStore.settings();if(s.currency==='BRL'&&!s.rateManual)DeckStore.fetchRate(false).then(function(r){if(r&&document.body.dataset.view==='deck')DeckUI.render();});
})();
</script>
</body>
